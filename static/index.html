  if (biome === 1 && worldData && worldData.biomes &&
      _paintBeach(octx, x, y, worldData.width, worldData.height, worldData.biomes)) return;
  // Frange d'éboulis (nº26, miroir du build) : herbe qui reprend à ≤2 tuiles du massif immuable
  // → gravier (d=1) / rochers épars (d=2), zéro overlay. (La terre battue à d≤2 reste telle quelle.)
  if (biome === 1 && mountainMask) {
    const md = _mtDist(x, y, worldData.width, worldData.height);
    if (md === 1) {
      octx.drawImage(GRAVEL_SPRITE.img, ((x * 7 + y * 13) % 3) * T, T, T, T, x * T, y * T, T, T);
      const [, eh2] = hash2(x, y, 7);
      if (eh2 < 0.18)
        octx.drawImage(BIOME_SPRITES[4].overlay.img, (Math.floor(eh2 * 16) % 3) * T, 0, T, T, x * T, y * T, T, T);
      return;
    }
    if (md === 2) {
      octx.drawImage(BIOME_SPRITES[1].img, ((x * 7 + y * 13) % 3) * T, plaineRow(x, y) * T, T, T, x * T, y * T, T, T);
      const [eh, eh2] = hash2(x, y, 7);
      if (eh < 0.22)
        octx.drawImage(BIOME_SPRITES[4].overlay.img, Math.floor(eh2 * 3) * T, 0, T, T, x * T, y * T, T, T);
      return;
    }
  }
  const sp = BIOME_SPRITES[biome] || BIOME_SPRITES[1];
  const v  = (x * 7 + y * 13) % (sp.cols * sp.rows);
  // Plaine (nº5) : mêmes prairies nuancées qu'au build (cohérence reprise DIRT→GRASS).
  const tc = biome === 1 ? (x * 7 + y * 13) % 3 : sp.col0 + (v % sp.cols);
  const tr = biome === 1 ? plaineRow(x, y)      : (sp.row0 || 0) + Math.floor(v / sp.cols);
  octx.drawImage(sp.img, tc * T, tr * T, T, T, x * T, y * T, T, T);
  const ovList = sp.overlay ? (Array.isArray(sp.overlay) ? sp.overlay : [sp.overlay]) : [];
  ovList.forEach((ov, i) => {
    const h1 = Math.abs(Math.sin(x * (127.1 + i * 53) + y * (311.7 + i * 79)) * 43758.5453) % 1;
    if (h1 < ov.density / 10) {
      const h2 = Math.abs(Math.sin(x * (269.5 + i * 37) + y * (183.3 + i * 61)) * 43758.5453) % 1;
      const v2 = Math.floor(h2 * ov.cols * ov.rows);
      const oc = ov.col0 + (v2 % ov.cols);
      const or2 = (ov.row0 || 0) + Math.floor(v2 / ov.cols);
      octx.drawImage(ov.img, oc * T, or2 * T, T, T, x * T, y * T, T, T);
    }
  });
}

function fitWorld() {
  if (!worldData) return;
  const W = worldData.width * TILE_SIZE, H = worldData.height * TILE_SIZE;
  const cw = canvasWrap.clientWidth  || window.innerWidth - 280;
  const ch = canvasWrap.clientHeight || window.innerHeight - 50;
  scale = Math.min(cw / W, ch / H);
  offX  = (cw - W * scale) / 2;
  offY  = (ch - H * scale) / 2;
}

// ── Rendu ────────────────────────────────────────────────────────────────────
// Position interpolée d'une entité entre son tick précédent et le courant.
// Snap au-delà de 4 tuiles (téléport de secours d'eau) → pas de glissade à travers la carte.
function ipx(e){ const p = prevPos[e.id]; if(!p) return e.x; const d = e.x - p.x; return Math.abs(d) > 4 ? e.x : p.x + d * renderAlpha; }
function ipy(e){ const p = prevPos[e.id]; if(!p) return e.y; const d = e.y - p.y; return Math.abs(d) > 4 ? e.y : p.y + d * renderAlpha; }

// Frame source [col,row] d'une entité (refonte nº1). Espèce animée + en mouvement →
// direction (déplacement du dernier tick) + frame de marche (~128 ms, déphasée par id) ;
// sinon frame idle/fixe. Le chef et les espèces non listées gardent sp.col/sp.row.
// Poissons (nº4) : 3 espèces (cols 2-4, stable par id) × 4 directions. Mapping marine
// up:0/left:1/right:2/down:3 — INVERSE des terrestres sur les verticales. 1 frame/dir.
const FISH_ROWS = { up: 0, left: 1, right: 2, down: 3 };
function entityFrame(e, sp, isChief) {
  if (e.t === "fish") {
    const col = 2 + (Math.abs(e.id | 0) % 3);
    const p = prevPos[e.id];
    const dx = p ? e.x - p.x : 0, dy = p ? e.y - p.y : 0;
    let dir = "right";
    if (Math.abs(dx) >= 0.02 || Math.abs(dy) >= 0.02)
      dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    return [col, FISH_ROWS[dir]];
  }
  const anim = !isChief && (sp.anim || ENTITY_ANIM[e.t]);   // sp.anim = layout des planches métier V9
  if (!anim) return [sp.col, sp.row];
  const p = prevPos[e.id];
  const dx = p ? e.x - p.x : 0, dy = p ? e.y - p.y : 0;
  if (Math.abs(dx) < 0.02 && Math.abs(dy) < 0.02) return [anim.idle.c, anim.idle.r];
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  const frame = ((performance.now() >> 7) + (e.id | 0)) & 3;   // 4 frames, déphasage par id
  return [anim.cols[frame], anim.rows[dir]];
}

// Boucle de rendu 60 fps découplée du tick moteur (~6 ticks/s) : interpole les
// positions → mouvement fluide même quand le moteur calcule lentement.
function renderLoop(){
  renderAlpha = lastTickTime ? Math.min(1, (performance.now() - lastTickTime) / tickInterval) : 1;
  drawAll();
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

// Météo animée, pilotée par le TEMPS RÉEL (performance.now) → fluide à 60 fps,
// indépendante du rythme des ticks. En DEUX couches : les ombres de nuages au SOL
// (sous les entités), les précipitations + flash d'éclair AU-DESSUS de tout.

// Couche SOL : ombres douces de nuages qui dérivent (ambiance permanente, + sous la pluie).
function drawWeatherGround(ctx) {
  const Wp = worldData.width * TILE_SIZE, Hp = worldData.height * TILE_SIZE;
  const now = performance.now();
  const nClouds = currentRain ? 7 : 4;
  const cloudA  = currentStorm ? 0.24 : currentRain ? 0.16 : 0.08;
  for (let i = 0; i < nClouds; i++) {
    const seed  = i * 127.3;
    const cw    = Wp * (0.20 + (i % 3) * 0.09);
    const speed = 0.006 + (i % 4) * 0.004;                 // px/ms, lent
    const x = ((seed * 17 + now * speed) % (Wp + cw)) - cw / 2;
    const y = (Math.sin(seed) * 0.5 + 0.5) * Hp * 0.7 + Hp * 0.05;
    const g = ctx.createRadialGradient(x, y, 0, x, y, cw / 2);
    g.addColorStop(0, `rgba(38,44,60,${cloudA})`);
    g.addColorStop(1, "rgba(38,44,60,0)");
    ctx.save();
    ctx.translate(x, y); ctx.scale(1, 0.5);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, cw / 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // Flaques (nº11) : creux qui se remplissent pendant l'averse, sèchent longtemps après.
  // Positions déterministes (hash), hors eau/rivière/montagne. Taille/opacité ∝ puddleWet.
  if (puddleWet > 0.03) {
    const p = puddleWet, T = TILE_SIZE, bm = worldData.biomes;
    const NP = Math.min(60, Math.round(worldData.width * worldData.height * 0.0025));
    for (let i = 0; i < NP; i++) {
      const [hx, hy] = hash2(i * 3 + 1, 7, 21);
      const tx = Math.floor(hx * worldData.width), ty = Math.floor(hy * worldData.height);
      const b = bm[ty][tx];
      if (b === 0 || b === 5 || (mountainMask && mountainMask[ty][tx])) continue;
      const [jx, jy] = hash2(i, 11, 22);
      const x = (tx + 0.2 + jx * 0.6) * T, y = (ty + 0.3 + jy * 0.4) * T;
      const rx = (2.5 + (i % 4) * 1.1) * p, ry = rx * 0.5;
      ctx.fillStyle = `rgba(90,135,185,${(0.5 * p).toFixed(3)})`;
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(225,242,255,${(0.45 * p).toFixed(3)})`;
      ctx.fillRect(Math.round(x - rx * 0.35), Math.round(y - ry * 0.5), 2, 1);
    }
  }
}

// Impacts de pluie + voile humide (nº11) : dessinés APRÈS le tri de profondeur (sur le sol,
// les arbres et les bêtes), sous la lumière jour/nuit. Impacts dispersés dans le VIEWPORT
// (densité stable quel que soit le zoom) ; voile multiply qui assombrit le monde mouillé.
function drawRainImpacts(ctx) {
  if (rainWet < 0.02) return;
  const r = rainWet, now = performance.now();
  const x0 = -offX / scale, y0 = -offY / scale, vw = canvas.width / scale, vh = canvas.height / scale;
  const N = Math.round(Math.min(vw * vh / 1400, 260) * r);
  for (let i = 0; i < N; i++) {
    const cyc = 650, ph = ((now + i * 97) % cyc) / cyc, k2 = Math.floor((now + i * 97) / cyc);
    const [hx, hy] = hash2(i * 13 + (k2 % 97), k2 % 89, 23);
    const x = x0 + hx * vw, y = y0 + hy * vh;
    if (ph < 0.3) {
      ctx.fillStyle = "rgba(230,240,255,0.8)";
      ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
    } else {
      ctx.strokeStyle = `rgba(220,235,255,${((1 - ph) * 0.5).toFixed(3)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, (ph - 0.3) * 9, 0, Math.PI * 2); ctx.stroke();
    }
  }
  // Voile humide (multiply) CLIPPÉ aux bornes du monde : un fillRect opaque en espace-monde sur
  // les pixels transparents hors-monde peindrait un letterbox gris (bug relevé par Regigigas).
  const wpx = worldData.width * TILE_SIZE, hpx = worldData.height * TILE_SIZE;
  const vx0 = Math.max(x0, 0), vy0 = Math.max(y0, 0);
  const vx1 = Math.min(x0 + vw, wpx), vy1 = Math.min(y0 + vh, hpx);
  if (vx1 > vx0 && vy1 > vy0) {
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    const k = 0.35 * r;
    ctx.fillStyle = `rgb(${Math.round(255 - 80 * k)},${Math.round(255 - 65 * k)},${Math.round(255 - 40 * k)})`;
    ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
    ctx.restore();
  }
}

// Fumée des incendies (nº13) : volutes grises montantes, dessinées APRÈS le tri (au-dessus
// des arbres et des bêtes) → la fumée s'élève dans la scène. Dérive au vent, s'efface en montant.
function drawFireSmoke(ctx) {
  if (!fires.size) return;
  const T = TILE_SIZE, now = performance.now();
  fires.forEach((intensity, key) => {
    const [fx, fy] = key.split(",").map(Number);
    const inten = Math.min(1, intensity / 100);
    for (let s = 0; s < 2; s++) {
      const cyc = 2600, ph = ((now + s * 1300 + (fx * 53 + fy * 29)) % cyc) / cyc;
      const [hx] = hash2(fx + s, fy, 34);
      const drift = Math.sin(now / 900 + fx) * 6;
      const px = (fx + 0.5) * T + drift * ph + (hx - 0.5) * 6;
      const py = (fy + 0.3) * T - ph * T * 2.2;
      const rr = T * (0.2 + ph * 0.5);
      ctx.fillStyle = `rgba(90,86,82,${((1 - ph) * 0.28 * inten).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
    }
  });
}

// Éclairs visibles (nº14) : sur un event `lightning` (qui porte la tuile frappée), une
// polyligne brisée déterministe descend du ciel jusqu'au point d'impact, cœur blanc sur halo
// bleu, pulsante ~450 ms, + flash d'impact radial. La frappe enflamme l'arbre côté moteur (nº13).
function drawLightning(ctx) {
  if (!lightningBolts.length) return;
  const T = TILE_SIZE, now = performance.now();
  for (let b = lightningBolts.length - 1; b >= 0; b--) {
    const bolt = lightningBolts[b];
    const age = now - bolt.t;
    if (age > 450) { lightningBolts.splice(b, 1); continue; }
    const life = 1 - age / 450;
    const a = life * (0.6 + 0.4 * Math.sin(now / 40));   // scintillement rapide
    const ex = (bolt.x + 0.5) * T, ey = (bolt.y + 0.5) * T, topY = ey - 11 * T;
    const pts = [], NS = 7;
    for (let i = 0; i <= NS; i++) {
      const [jx] = hash2(bolt.x + i, bolt.y, 40 + i);
      const jit = (i === 0 || i === NS) ? 0 : (jx - 0.5) * T * 2.2;
      pts.push([ex + jit, topY + (ey - topY) * (i / NS)]);
    }
    const stroke = (w, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.stroke();
    };
    stroke(3.5, `rgba(150,190,255,${(a * 0.5).toFixed(3)})`);   // halo bleu
    stroke(1.4, `rgba(255,255,255,${a.toFixed(3)})`);           // cœur blanc
    const ir = T * (1.2 + (1 - life) * 2);                      // flash d'impact
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, ir);
    g.addColorStop(0, `rgba(230,240,255,${(a * 0.8).toFixed(3)})`);
    g.addColorStop(1, "rgba(230,240,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ex, ey, ir, 0, Math.PI * 2); ctx.fill();
  }
}

// (nº18 « vent dans l'air » — traits blancs + pétales portés — RETIRÉ à la demande d'Alexis
// le 2026-07-17. La houle du blé mûr et le vent des cimes/canopée restent, eux, en place.)

// Ambiance vivante (refonte nº21) : papillons + oiseaux + scintillements d'eau + brume d'aube
// sur les mares. Purement décoratif, dispersé dans le viewport (densité stable au zoom).
function drawAmbient(ctx) {
  if (!worldData) return;
  const now = performance.now(), T = TILE_SIZE;
  const winter = currentSeason === "winter", calm = !currentRain && !currentStorm;
  const day = Math.max(0, -Math.cos(2 * Math.PI * _dayFraction()));   // 0 nuit → 1 midi (gate jour)
  const wpx = worldData.width * TILE_SIZE, hpx = worldData.height * TILE_SIZE;
  const x0 = -offX / scale, y0 = -offY / scale, vw = canvas.width / scale, vh = canvas.height / scale;
  // Papillons (jour clair, hors hiver) : 3, ailes 2 px alternées, vol sinueux
  if (!winter && calm && day > 0.2) {
    const cols = ["#f5d76e", "#e8a0c0", "#a0c8f0"];
    for (let i = 0; i < 3; i++) {
      const bx = x0 + ((i * 0.37 + now / 26000) % 1) * vw + Math.sin(now / 700 + i * 2) * 24;
      const by = y0 + (0.25 + 0.45 * ((i * 0.53) % 1)) * vh + Math.cos(now / 560 + i * 3) * 18;
      ctx.fillStyle = cols[i];
      if ((now >> (6 + i)) & 1) { ctx.fillRect(bx - 2, by, 2, 2); ctx.fillRect(bx + 1, by, 2, 2); }
      else { ctx.fillRect(bx - 1, by - 1, 2, 2); ctx.fillRect(bx, by + 1, 2, 1); }
    }
  }
  // Oiseaux : 2 traversées en « v » battant, en altitude (cycles longs)
  for (let i = 0; i < 2; i++) {
    const cyc = 12000 + i * 3000, ph = ((now + i * 6000) % cyc) / cyc;
    const bx = x0 + ph * (vw + 40) - 20, by = y0 + (0.1 + i * 0.06) * vh + Math.sin(ph * 8) * 6;
    const flap = ((now >> 7) & 1) ? 3 : 1;
    ctx.strokeStyle = "rgba(40,40,50,0.6)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx - 3, by + flap); ctx.lineTo(bx, by); ctx.lineTo(bx + 3, by + flap); ctx.stroke();
  }
  // Scintillements d'eau + brume d'aube sur les mares (échantillon déterministe, léger)
  const dawn = Math.max(0, 1 - Math.abs(_dayFraction() - 0.25) / 0.09);   // fenêtre d'aube
  const bm = worldData.biomes;
  for (let i = 0; i < 34; i++) {
    const cyc = 1600, ph = ((now + i * 211) % cyc) / cyc, k2 = Math.floor((now + i * 211) / cyc);
    const [hx, hy] = hash2(i + (k2 % 50), k2 % 40, 44);
    const wx = x0 + hx * vw, wy = y0 + hy * vh, tx = Math.floor(wx / T), ty = Math.floor(wy / T);
    if (tx < 0 || ty < 0 || tx >= worldData.width || ty >= worldData.height) continue;
    const b = bm[ty][tx];
    if (b !== 0 && b !== 5) continue;
    if (dawn > 0.05 && !winter) {                        // brume d'aube : nappe basse translucide
      ctx.fillStyle = `rgba(228,236,240,${(0.28 * dawn).toFixed(3)})`;
      ctx.beginPath(); ctx.ellipse(wx, wy, T * 1.1, T * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (ph < 0.3) {                                      // éclat bref sur l'eau
      ctx.fillStyle = `rgba(255,255,255,${(0.8 * (1 - ph / 0.3)).toFixed(3)})`;
      ctx.fillRect(Math.round(wx), Math.round(wy), 2, 2);
    }
  }
  // Rosée / givre à l'aube (nº24) : glints sur l'herbe (bleutés en hiver), fenêtre du lever.
  if (dawn > 0.05) {
    for (let i = 0; i < 22; i++) {
      const cyc = 1400, ph = ((now + i * 181) % cyc) / cyc, k2 = Math.floor((now + i * 181) / cyc);
      const [hx, hy] = hash2(i + (k2 % 44), k2 % 38, 45);
      const wx = x0 + hx * vw, wy = y0 + hy * vh, tx = Math.floor(wx / T), ty = Math.floor(wy / T);
      if (tx < 0 || ty < 0 || tx >= worldData.width || ty >= worldData.height) continue;
      const b = bm[ty][tx];
      if ((b !== 1 && b !== 6) || ph > 0.4) continue;
      const a = (winter ? 0.9 : 0.8) * dawn * (1 - ph / 0.4);
      ctx.fillStyle = winter ? `rgba(200,225,255,${a.toFixed(3)})` : `rgba(255,255,255,${a.toFixed(3)})`;
      ctx.fillRect(Math.round(wx), Math.round(wy), 1, 1);
    }
  }
  // Graines dérivantes (nº24) : au printemps, aigrettes blanches qui flottent.
  if (currentSeason === "spring" && !currentRain) {
    for (let i = 0; i < 7; i++) {
      const cyc = 6000, ph = ((now + i * 800) % cyc) / cyc;
      const sx = x0 + ((i * 0.14 + now / 40000) % 1) * vw + Math.sin(now / 500 + i) * 20;
      const sy = y0 + ph * vh * 0.7 + Math.sin(ph * 8 + i) * 10;
      if (sx < 0 || sx > wpx || sy < 0 || sy > hpx) continue;   // pas dans le letterbox
      ctx.fillStyle = "rgba(250,250,240,0.8)";
      ctx.beginPath(); ctx.arc(sx, sy, 1.5, 0, Math.PI * 2); ctx.fill();
    }
  }
  // Pollen (nº19) : au printemps/été, fines particules dorées en suspension (jour clair).
  if ((currentSeason === "spring" || currentSeason === "summer") && calm && day > 0.2) {
    for (let i = 0; i < 12; i++) {
      const cyc = 4200, ph = ((now + i * 350) % cyc) / cyc;
      const gx = x0 + ((i * 0.083 + now / 30000) % 1) * vw + Math.sin(now / 800 + i * 1.7) * 8;
      const gy = y0 + ((i * 0.11) % 1) * vh + Math.sin(ph * 6 + i) * 12;
      if (gx < 0 || gx > wpx || gy < 0 || gy > hpx) continue;   // pas dans le letterbox
      ctx.fillStyle = `rgba(250,224,120,${(0.35 + 0.25 * Math.sin(ph * Math.PI * 2)).toFixed(3)})`;
      ctx.fillRect(Math.round(gx), Math.round(gy), 1, 1);
    }
  }
}

// Feuilles d'automne (nº16) : pluie de feuilles dérivant du haut du viewport (densité stable
// au zoom), 4 teintes, oscillation au vent. Purement décoratif, saison automne uniquement.
function drawSeasonFx(ctx) {
  if (currentSeason !== "autumn") return;
  const now = performance.now();
  const x0 = -offX / scale, y0 = -offY / scale, vw = canvas.width / scale, vh = canvas.height / scale;
  const N = Math.round(Math.min(vw * vh / 2600, 160));
  const cols = ["#c9822e", "#b8532e", "#d9a441", "#8f5a2b"];
  const wpx = worldData.width * TILE_SIZE, hpx = worldData.height * TILE_SIZE;
  for (let i = 0; i < N; i++) {
    const cyc = 3400, tt = now + i * 211, ph = (tt % cyc) / cyc, k2 = Math.floor(tt / cyc);
    const [hx] = hash2(i + (k2 % 71), k2 % 67, 42);
    const x = x0 + hx * vw + Math.sin(ph * 6 + i) * 12;
    const y = y0 - 10 + ph * (vh + 20);
    if (x < 0 || x > wpx || y < 0 || y > hpx) continue;   // pas de feuilles dans le letterbox
    ctx.fillStyle = cols[i & 3];
    ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
}

// Couche CIEL : précipitations (pluie/neige), voile de canicule, flash d'éclair — AU-DESSUS.
// Dessinée en ESPACE-ÉCRAN (après ctx.restore) → remplit le viewport uniformément,
// densité constante quel que soit le zoom (en espace-monde les particules se diluaient
// sur toute la carte 220×160 → « trop faible »). Densité montée nettement.
// Lumières et instants (refonte nº24) — couche CIEL en espace-écran : arc-en-ciel après
// l'averse (de jour), aurore boréale (hiver + nuit), rais de lumière diagonaux (de jour).
// Chaque effet est gated par la fenêtre horaire × saison (piège nº24 : jamais d'arc en pleine nuit).
function drawSkyInstants(ctx) {
  const Sw = canvas.width, Sh = canvas.height, now = performance.now();
  const elev = -Math.cos(2 * Math.PI * _dayFraction());   // -1 nuit, +1 midi
  const day = Math.max(0, elev), night = Math.max(0, -elev);
  const winter = currentSeason === "winter";
  if (!currentRain && !currentStorm && puddleWet > 0.12 && puddleWet < 0.6 && day > 0.2) {
    const a = Math.min(puddleWet, 0.6) * day * 0.5;       // arc-en-ciel post-averse (inertie flaques → ~4-6 s)
    const cx = Sw * 0.5, cy = Sh * 1.05, R = Math.min(Sw, Sh) * 0.75;
    const bands = ["255,80,80", "255,180,60", "240,230,90", "90,210,120", "90,160,240", "160,110,220"];
    ctx.lineWidth = 4;
    for (let i = 0; i < bands.length; i++) {
      ctx.strokeStyle = `rgba(${bands[i]},${a.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(cx, cy, R - i * 4, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    }
  }
  if (winter && night > 0.3) {                            // aurore boréale (ondes vertes screen)
    ctx.save(); ctx.globalCompositeOperation = "screen";
    for (let w = 0; w < 3; w++) {
      ctx.beginPath();
      for (let x = 0; x <= Sw; x += 8) {
        const y = Sh * 0.16 + w * Sh * 0.05 + Math.sin(x * 0.008 + now / 1400 + w) * Sh * 0.04;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.lineWidth = 20 - w * 4;
      ctx.strokeStyle = `rgba(90,230,150,${(0.06 * night).toFixed(3)})`;
      ctx.stroke();
    }
    ctx.restore();
  }
  if (day > 0.35) {                                       // rais de lumière diagonaux
    ctx.save(); ctx.globalCompositeOperation = "screen";
    for (let i = 0; i < 3; i++) {
      const x = Sw * (0.2 + i * 0.3) + Math.sin(now / 5000 + i) * 20;
      const g = ctx.createLinearGradient(x, 0, x - Sh * 0.4, Sh);
      g.addColorStop(0, `rgba(255,245,200,${(0.05 * day).toFixed(3)})`);
      g.addColorStop(1, "rgba(255,245,200,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - 30, 0); ctx.lineTo(x + 30, 0);
      ctx.lineTo(x + 30 - Sh * 0.4, Sh); ctx.lineTo(x - 30 - Sh * 0.4, Sh);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
}

function drawWeatherSky(ctx) {
  const Sw = canvas.width, Sh = canvas.height;
  const now = performance.now();
  const winter = currentSeason === "winter";

  // Brume de chaleur (nº15) : la scène finale est ré-échantillonnée en bandes horizontales
  // décalées d'un sinus → l'air tremble au-dessus du sol chaud. Snapshot puis redraw décalé.
  if (heatDry > 0.1) {
    if (!_shimmerCv) _shimmerCv = document.createElement("canvas");
    if (_shimmerCv.width !== Sw || _shimmerCv.height !== Sh) { _shimmerCv.width = Sw; _shimmerCv.height = Sh; }
    const sc = _shimmerCv.getContext("2d");
    sc.clearRect(0, 0, Sw, Sh); sc.drawImage(canvas, 0, 0);
    const amp = 1.6 * heatDry, bandH = 4;
    for (let y = 0; y < Sh; y += bandH) {
      const dx = Math.sin(now / 230 + y * 0.13) * amp;
      ctx.drawImage(_shimmerCv, 0, y, Sw, bandH, dx, y, Sw, bandH);
    }
  }

  // Pluie (hors hiver) : voile + stries denses
  if (currentRain && !winter) {
    ctx.fillStyle = currentStorm ? "rgba(28,33,62,0.32)" : "rgba(78,108,172,0.15)";
    ctx.fillRect(0, 0, Sw, Sh);
    const density = (Sw * Sh) / 2600;                       // ~à l'échelle du viewport
    const N = Math.round(density * (currentStorm ? 1.5 : 1.0));
    const speed = currentStorm ? 1.6 : 0.85;
    const len = currentStorm ? 28 : 17, wind = currentStorm ? 0.45 : 0.22;
    ctx.strokeStyle = currentStorm ? "rgba(195,210,255,0.65)" : "rgba(185,208,255,0.55)";
    ctx.lineWidth = currentStorm ? 1.5 : 1.1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const col = (i * 137.5) % Sw;
      const y = ((i * 53.3 + now * speed) % (Sh + 40)) - 20;
      ctx.moveTo(col, y); ctx.lineTo(col - len * wind, y + len);
    }
    ctx.stroke();
  }

  // Neige (hiver) : flocons denses qui se balancent, blizzard si précipitations
  if (winter) {
    if (currentRain) { ctx.fillStyle = "rgba(215,225,245,0.18)"; ctx.fillRect(0, 0, Sw, Sh); }
    const density = (Sw * Sh) / 2200;
    const N = Math.round(density * (currentRain ? 1.9 : 1.0));
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    for (let i = 0; i < N; i++) {
      const speed = 0.035 + (i % 6) * 0.013;
      const y = ((i * 71.7 + now * speed) % (Sh + 12)) - 6;
      const x = ((i * 149.3) % Sw) + Math.sin(now * 0.0011 + i) * 16;
      const r = 1.1 + (i % 3) * 0.8;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Canicule : voile orangé qui ondule (plus marqué)
  if (currentHeatwave) {
    const pulse = 0.11 + 0.06 * Math.sin(now * 0.002);
    ctx.fillStyle = `rgba(255,120,0,${pulse.toFixed(3)})`;
    ctx.fillRect(0, 0, Sw, Sh);
  }

  // Éclair : flash bleuté plein écran qui décroît (~280 ms) sur un event `lightning`
  const dt = now - lightningAt;
  if (dt >= 0 && dt < 280) {
    const lf = (1 - dt / 280) ** 2;
    ctx.fillStyle = `rgba(222,236,255,${(lf * 0.65).toFixed(3)})`;
    ctx.fillRect(0, 0, Sw, Sh);
  }
  drawSkyInstants(ctx);   // arc-en-ciel / aurore / rais de lumière (nº24)
}

function drawAll() {
  if (!worldData || !biomeCache) return;
  const W = worldData.width, H = worldData.height;
  updateWet(performance.now());   // accumulateurs d'humidité (nº11)

  // Suivi caméra : recentre sur l'entité suivie
  if (trackedId !== null) {
    const e = entityMap[trackedId];
    if (e) {
      const cw = canvasWrap.clientWidth  || canvas.width;
      const ch = canvasWrap.clientHeight || canvas.height;
      offX = cw / 2 - (ipx(e) + 0.5) * TILE_SIZE * scale;
      offY = ch / 2 - (ipy(e) + 0.5) * TILE_SIZE * scale;
    } else {
      trackedId = null;   // entité morte/disparue → arrête le suivi
    }
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);

  // Fond biomes (pas d'interpolation → pixels nets)
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(biomeCache, 0, 0);

  // Fronts de falaise (nº9-cœur v2) — dézoomé : nappe statique blittée ICI (relief sous les
  // entités, comme avant l'extraction). Zoomé : WALLS passe par le tri de profondeur plus bas.
  if (scale < CANOPY_WIND_MIN_SCALE && wallsCanvas) ctx.drawImage(wallsCanvas, 0, 0);

  // Vagues animées (nº4) : détail de surface de l'eau, au-dessus du fond, sous tout le reste.
  drawWaves(ctx);
  drawRiverFlow(ctx);   // risées de courant sur les rivières (nº17)

  // Souches d'arbres (forêt coupée, avant l'overlay saisonnier)
  drawStumps(ctx);

  // Manteau neigeux (nº12) : overlay dithéré sur le sol, sous les entités (elles marchent
  // dessus). Cache reconstruit à la volée quand la couverture bouge (updateWet).
  if (snowCanvas) ctx.drawImage(snowCanvas, 0, 0);
  if (dryCanvas)  ctx.drawImage(dryCanvas, 0, 0);   // sécheresse (nº15) : herbe jaunie, mares boueuses

  // Overlay saisonnier
  const seasonOverlay = (SEASONS[currentSeason] || SEASONS.spring).overlay;
  ctx.fillStyle = seasonOverlay;
  ctx.fillRect(0, 0, worldData.width * TILE_SIZE, worldData.height * TILE_SIZE);

  // Météo — couche SOL (ombres de nuages, sous les entités). Ciel dessiné après les entités.
  drawWeatherGround(ctx);

  // Territoires des clans (T1) — vrai owner-grid moteur (via /api/territory), blitté à
  // l'échelle du monde. Remplace l'ancienne boîte approximative : on voit la vraie carte
  // de contrôle (zones organiques par proximité aux bâtiments), le visuel « empires ».
  const T = TILE_SIZE;
  // Sentiers (F3) : usure du sol par le passage — SOUS le territoire et les bâtiments, juste
  // au-dessus du sol. Lissage désactivé : la trace suit la tuile (chemin net, pas un nuage).
  if (trailCanvas && worldData) {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(trailCanvas, 0, 0, worldData.width * T, worldData.height * T);
    ctx.restore();
  }
  if (territoryCanvas && worldData) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;   // zones douces (influence) plutôt que pixelisées
    ctx.drawImage(territoryCanvas, 0, 0, worldData.width * T, worldData.height * T);
    ctx.restore();
  }
  // Voile des terres inconnues (G1) : au-dessus du sol, sous les bâtiments et les créatures.
  // Lissage ON → la frontière du su et de l'inconnu est floue, pas un damier.
  if (exploredCanvas && worldData) {
    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(exploredCanvas, 0, 0, worldData.width * T, worldData.height * T);
    ctx.restore();
  }
  // Numéro de clan en filigrane, centré sur chaque feu de camp (repère de capitale)
  buildings.filter(b => b.btype === "campfire").forEach(fire => {
    const clan = clans.find(c => c.id === fire.clan_id);
    if (!clan) return;
    ctx.font         = `bold ${T * 2.5}px sans-serif`;
    ctx.textAlign    = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle    = clan.color + "66";
    ctx.fillText(`${clan.id + 1}`, fire.x * T, fire.y * T);
  });

  // Sol carbonisé (nº13) : mémoire front des tuiles brûlées, s'estompe en ~22 s (le moteur
  // fait repousser les arbres ; la trace de suie est un souvenir purement visuel).
  const nowF = performance.now();
  charred.forEach((tEnd, key) => {
    const age = (nowF - tEnd) / 22000;
    if (age >= 1) { charred.delete(key); return; }
    const [cx, cy] = key.split(",").map(Number);
    ctx.fillStyle = `rgba(40,29,20,${(0.55 * (1 - age)).toFixed(3)})`;
    ctx.fillRect(cx * T, cy * T, T, T);
  });
  // Feux de forêt (nº13) : flammes vacillantes (gradient radial + scintillement) + socle
  // carbonisé + braises montantes. La propagation est moteur (world.step_fire) ; ici = rendu.
  if (fires.size > 0) {
    fires.forEach((intensity, key) => {
      const [fx, fy] = key.split(",").map(Number);
      const inten = Math.min(1, intensity / 100);
      const cx2 = (fx + 0.5) * T, cy2 = (fy + 0.5) * T;
      ctx.fillStyle = "rgba(40,29,20,0.5)";                         // socle carbonisé sous le feu
      ctx.fillRect(fx * T, fy * T, T, T);
      const flick = 0.7 + 0.3 * Math.sin(nowF / 90 + (fx * 7 + fy * 13));
      const r = T * (0.32 + 0.18 * inten) * flick;
      const grad = ctx.createRadialGradient(cx2, cy2 + T * 0.15, 0, cx2, cy2 + T * 0.15, r * 1.6);
      grad.addColorStop(0, `rgba(255,238,120,${(0.9 * inten).toFixed(3)})`);
      grad.addColorStop(0.5, `rgba(240,120,20,${(0.8 * inten).toFixed(3)})`);
      grad.addColorStop(1, "rgba(180,40,10,0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx2, cy2 + T * 0.15, r * 1.6, 0, Math.PI * 2); ctx.fill();
      for (let e = 0; e < 3; e++) {                                 // braises montantes 2 px
        const cyc = 900, ph = ((nowF + e * 300 + (fx * 31 + fy * 17)) % cyc) / cyc;
        const [ex] = hash2(fx + e, fy, 33);
        const px = fx * T + (2 + ex * (T - 4));
        const py = (fy + 1) * T - ph * T * 1.4;
        ctx.fillStyle = `rgba(255,${Math.round(180 - ph * 120)},40,${((1 - ph) * inten).toFixed(3)})`;
        ctx.fillRect(Math.round(px), Math.round(py), 2, 2);
      }
    });
  }

  // Ombres portées (refonte nº8) : sol → OMBRES → tout ce qui est debout (bâtiments,
  // créatures). Masque unique composité une fois → pas de double noircissement.
  drawShadows(ctx);

  // Maisons construites
  // Filons d'or (C2) : la montagne scintille
  goldVeins.forEach(([vx, vy]) => {
    const a = 0.35 + 0.35 * Math.sin(currentTick * 0.25 + (vx * 7 + vy * 13));
    ctx.fillStyle = `rgba(253,230,138,${a})`;
    ctx.fillRect((vx + 0.4) * T, (vy + 0.4) * T, T * 0.2, T * 0.2);
  });
  drawBuildings(ctx, T);
  drawBuildingFx(ctx, T);   // vie des bâtiments (nº20) : fumée, ailes de moulin, braises, fanions
  // Ondes de cloche (C1) : anneau expansif ~40 ticks (vieilli au tick, cf. handleTick)
  bellRings.forEach(r => {
    ctx.beginPath();
    ctx.arc((r.x + 0.5) * T, (r.y + 0.5) * T, T * (0.5 + r.age * 0.35), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(174,214,241,${Math.max(0, 1 - r.age / 40)})`;
    ctx.lineWidth = Math.max(1, T * 0.08);
    ctx.stroke();
  });
  // Éclats de capture (bloc E) : bref flash rouge au point du kill (~10 ticks, vieilli au tick)
  huntFlashes.forEach(f => {
    const a = Math.max(0, 1 - f.age / 10);
    const px = (f.x + 0.5) * T, py = (f.y + 0.5) * T;
    ctx.strokeStyle = `rgba(220,38,38,${a})`;
    ctx.lineWidth = Math.max(1, T * 0.12);
    for (let i = 0; i < 6; i++) {
      const ang = i * Math.PI / 3;
      const r0 = T * 0.2, r1 = T * (0.35 + f.age * 0.12);
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(ang) * r0, py + Math.sin(ang) * r0);
      ctx.lineTo(px + Math.cos(ang) * r1, py + Math.sin(ang) * r1);
      ctx.stroke();
    }
  });
  // Os au sol à la mort (nº25) : petite croix blanche qui persiste puis s'efface (~160 ticks).
  deathMarks.forEach(m => {
    const a = Math.max(0, 1 - m.age / 160) * 0.8;
    const px = (m.x + 0.5) * T, py = (m.y + 0.5) * T, r = T * 0.16;
    ctx.strokeStyle = `rgba(235,235,225,${a.toFixed(3)})`;
    ctx.lineWidth = Math.max(1, T * 0.07);
    ctx.beginPath(); ctx.moveTo(px - r, py - r); ctx.lineTo(px + r, py + r);
    ctx.moveTo(px + r, py - r); ctx.lineTo(px - r, py + r); ctx.stroke();
  });
  // Étincelles de naissance (nº25) : petite bouffée dorée expansive (~14 ticks).
  birthSparks.forEach(s => {
    const a = Math.max(0, 1 - s.age / 14);
    const px = (s.x + 0.5) * T, py = (s.y + 0.5) * T, rr = T * (0.2 + s.age * 0.08);
    ctx.strokeStyle = `rgba(255,235,150,${a.toFixed(3)})`;
    ctx.lineWidth = Math.max(1, T * 0.08);
    for (let i = 0; i < 5; i++) {
      const ang = i * (Math.PI * 2 / 5) + s.age * 0.2;
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(ang) * T * 0.12, py + Math.sin(ang) * T * 0.12);
      ctx.lineTo(px + Math.cos(ang) * rr, py + Math.sin(ang) * rr);
      ctx.stroke();
    }
  });

  // Feux de camp (buildings de type campfire)
  buildings.filter(b => b.btype === "campfire").forEach(b => {
    const px = (b.x + 0.5) * T;
    const py = (b.y + 0.5) * T;
    if (CAMPFIRE_SPRITE.img.complete && CAMPFIRE_SPRITE.img.naturalWidth > 0) {
      const S = CAMPFIRE_SPRITE.size;
      const frame = Math.floor(performance.now() / 140) % 4;   // campfire.png = 64×16 (4 frames)
      ctx.drawImage(CAMPFIRE_SPRITE.img, frame * S, 0, S, S, px - S / 2, py - S / 2, S, S);
    } else {
      ctx.beginPath();
      ctx.arc(px, py, T * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = "#f97316";
      ctx.fill();
    }
    // Halo doré autour du campfire L2
    if (b.level >= 2) {
      ctx.beginPath();
      ctx.arc(px, py, T * 0.72, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,200,50,0.7)";
      ctx.lineWidth = T * 0.18;
      ctx.stroke();
    }
    // Badge L2
    if (b.level >= 2) {
      ctx.font = `${Math.max(5, T * 0.5)}px monospace`;
      ctx.textAlign = "center";
      ctx.fillStyle = "#fcd34d";
      ctx.fillText("★", px, py + T * 0.85);
    }
    // Badge d'âge technologique (A1) : nom de l'âge au-dessus du feu, dès Âge 1
    const cAge = clans.find(c => c.id === b.clan_id);
    if (cAge && (cAge.age ?? 0) > 0) {
      ctx.font = `${Math.max(5, T * 0.5)}px monospace`;
      ctx.textAlign = "center";
      ctx.fillStyle = "#c4b5fd";
      ctx.fillText(`⚒${cAge.age_name}`, px, py - T * 0.7);
    }
  });

  // (chantiers en cours dessinés dans drawBuildings via site_* btype)

  // Entités (coordonnées en pixels-sprite) — corps de dessin d'UNE créature, appelé par le
  // tri de profondeur ci-dessous (nº9). Fonction imbriquée : garde l'accès à ctx/T/clans/…
  ctx.imageSmoothingEnabled = false;
  function drawEntity(e) {
    if (!SPECIES[e.t]) return;
    const cx = (ipx(e) + 0.5) * T;
    const cy = (ipy(e) + 0.5) * T;
    // Cercle d'état (hunting / fleeing / trading) dessiné avant le sprite
    if (e.s === "hunting" || e.s === "fleeing" || e.s === "trading"
        || e.s === "praying" || e.s === "pilgrimage") {
      ctx.beginPath();
      ctx.arc(cx, cy, T * 0.52, 0, Math.PI * 2);
      ctx.strokeStyle = e.s === "hunting" ? "#ff4444"
                       : e.s === "trading" ? "#f1c40f"
                       : e.s === "praying" ? "#aed6f1"
                       : e.s === "pilgrimage" ? "#ecf0f1" : "#44aaff";
      ctx.lineWidth = T * 0.14;
      ctx.stroke();
    }
    // Pièce d'or en transit (C2) : cercle doré à la place du fagot
    if (e.cargo && (e.cargo[3] ?? 0) > 0) {
      const gl = 0.7 + 0.3 * Math.sin(currentTick * 0.4);
      ctx.beginPath();
      ctx.arc(cx, cy - T * 0.62, T * 0.12, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(252,211,77,${gl})`;
      ctx.fill();
    }
    // Mineur chargé d'or (C2) : badge doré haut-centre
    if (e.t === "human" && e.gold) {
      ctx.fillStyle = "#fcd34d";
      ctx.fillRect(cx - T * 0.08, cy - T * 0.78, T * 0.16, T * 0.12);
    }
    // Halo doré du béni (C1) : la grâce diffuse dans le village
    if (e.bl) {
      ctx.beginPath();
      ctx.arc(cx, cy - T * 0.55, T * 0.22, Math.PI, 2 * Math.PI);
      ctx.strokeStyle = "#f9e79f";
      ctx.lineWidth = Math.max(1, T * 0.08);
      ctx.stroke();
    }
    // Ballot de caravane (D1) : pastille cargaison au-dessus du marchand
    if (e.cargo && (e.cargo[0] > 0 || e.cargo[1] > 0 || (e.cargo[2] ?? 0) > 0)) {
      ctx.fillStyle = e.cargo[0] > 0 ? "#8B5A2B" : (e.cargo[2] ?? 0) > 0 ? "#475569" : "#95a5a6";
      ctx.fillRect(cx - T * 0.14, cy - T * 0.72, T * 0.28, T * 0.22);
      if ((e.cargo[2] ?? 0) > 0) {   // braise du fer
        ctx.fillStyle = "#f97316";
        ctx.fillRect(cx - T * 0.04, cy - T * 0.66, T * 0.08, T * 0.08);
      }
    }
    const kneel = e.s === "praying" ? Math.max(1, T * 0.08) : 0;   // posture (C1)
    const isChief = e.t === "human" && clans.some(c => c.chief_id === e.id);
    let sp = ENTITY_SPRITES[isChief ? "human_chief" : e.t];
    // Villageois non-chef coloré par clan : sprite selon le MÉTIER (P1, planches V9) si e.job est
    // défini, sinon fermier V9 (versatile/fallback). Le sprite porte son anim (JOB_ANIM idle col0).
    if (!isChief && e.t === "human" && e.clan != null) {
      const ci = ((e.clan - 1) % 4 + 4) % 4;
      const roleSet = (e.job && CLAN_ROLE_SPRITES[e.job]) || CLAN_ROLE_SPRITES.farmer;
      let cs = roleSet[ci];
      if (!(cs && cs.img.complete && cs.img.naturalWidth > 0)) cs = CLAN_FARMER_SPRITES[ci];  // fallback pack
      if (cs && cs.img.complete && cs.img.naturalWidth > 0) sp = cs;
    }
    if (sp && sp.img.complete && sp.img.naturalWidth > 0) {
      const S = sp.size || T;
      if (sp.srcCols) {
        // Sprite multi-tuiles (ex. requin) : source srcCols×srcRows tuiles → dest dstW×dstH tuiles
        const srcW = sp.srcCols * S, srcH = sp.srcRows * S;
        const dstW = sp.dstW * T,   dstH = sp.dstH * T;
        ctx.drawImage(sp.img, sp.col * S, sp.row * S, srcW, srcH,
                      cx - dstW / 2, cy - dstH / 2, dstW, dstH);
      } else {
        const [scol, srow] = entityFrame(e, sp, isChief);   // marche animée nº1
        ctx.drawImage(sp.img, scol * S, srow * S, S, S, cx - S / 2, cy - S / 2 + kneel, S, S);
      }
    } else {
      // Fallback cercle coloré
      ctx.beginPath();
      ctx.arc(cx, cy, T * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = SPECIES[e.t].color;
      ctx.fill();
    }
    // Badge hache — petit carré orange en haut à droite
    if (e.t === "human" && e.tool) {
      ctx.fillStyle = e.tool === "stone_axe" ? "#94a3b8" : "#f97316";
      ctx.fillRect(cx + T * 0.22, cy - T * 0.5, T * 0.28, T * 0.28);
    }
    // Badge pioche — petit carré gris-bleu en haut à gauche
    if (e.t === "human" && e.pick) {
      ctx.fillStyle = e.pick === "stone_pick" ? "#60a5fa" : "#a8a29e";
      ctx.fillRect(cx - T * 0.5, cy - T * 0.5, T * 0.28, T * 0.28);
    }
    // Badge faucille — petit carré vert en bas à droite
    if (e.t === "human" && e.sickle) {
      ctx.fillStyle = "#4ade80";
      ctx.fillRect(cx + T * 0.22, cy + T * 0.22, T * 0.28, T * 0.28);
    }
    // Badge arrosoir — petit carré bleu ciel en bas à gauche (bleu vif si plein)
    if (e.t === "human" && e.wcan) {
      ctx.fillStyle = e.can_filled ? "#38bdf8" : "#94a3b8";
      ctx.fillRect(cx - T * 0.5, cy + T * 0.22, T * 0.28, T * 0.28);
    }
    // Badge clan sous le sprite (humains uniquement)
    if (e.t === "human" && e.clan != null) {
      const clan = clans.find(c => c.id === e.clan);
      if (clan) {
        ctx.beginPath();
        ctx.arc(cx, cy + T * 0.45, T * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = clan.color;
        ctx.fill();
      }
    }
  }

  // Profondeur unifiée (nº9-cœur) : au zoom, arbres (32px), fronts de falaise (v2) et
  // créatures sont interclassés par ligne de pied → une bête au sud d'un arbre passe DEVANT
  // le tronc (au nord sous le feuillage), au pied d'une falaise elle grimpe DEVANT la paroi
  // (sur le plateau, derrière la CRÊTE). Dézoomé (vent/occlusion imperceptibles) : relief +
  // canopée en nappes statiques blittées d'un coup (perf) — même seuil que nº4/nº7.
  const sortedEnts = [...entities].filter(e => SPECIES[e.t]).sort((a, b) => ipy(a) - ipy(b));
  if (scale >= CANOPY_WIND_MIN_SCALE && (TREES.length || WALLS.length)) {
    const now = performance.now(), TT = TILE_SIZE;
    const x0 = -offX / scale - 40, y0 = -offY / scale - 48;
    const x1 = (canvas.width - offX) / scale + 40, y1 = (canvas.height - offY) / scale + 48;
    const items = [];
    for (const tr of TREES) {
      if (tr.px + tr.dw < x0 || tr.px > x1 || tr.py + tr.dh < y0 || tr.py > y1) continue;
      items.push({ base: tr.py + tr.dh, tr });   // ligne de pied = bas du sprite (bas de tuile)
    }
    for (const w of WALLS) {
      if ((w.x + 1) * TT < x0 || w.x * TT > x1 || (w.y + 1) * TT < y0 || w.y * TT > y1) continue;
      items.push({ base: w.base, w });           // occlusion à la CRÊTE (haut de la tuile front)
    }
    for (const e of sortedEnts) items.push({ base: ipy(e) * TT + TT / 2, e });
    items.sort((a, b) => a.base - b.base);
    for (const it of items) {
      if (it.tr) drawTreeSliced(ctx, it.tr, now);
      else if (it.w) ctx.drawImage(CLIFF_SPRITE.img, it.w.c * TT, it.w.r * TT, TT, TT, it.w.x * TT, it.w.y * TT, TT, TT);
      else drawEntity(it.e);
    }
  } else {
    sortedEnts.forEach(drawEntity);
    drawCanopy(ctx);   // dézoomé → nappe canopée statique
  }

  // Conséquences de la pluie (nº11) : impacts de gouttes + voile humide, par-dessus la scène
  // (sol/arbres/bêtes), sous la lumière. Les sélecteurs restent nets (dessinés après).
  drawRainImpacts(ctx);
  drawFireSmoke(ctx);   // fumée des incendies (nº13), au-dessus de la scène
  drawLightning(ctx);   // éclairs d'orage (nº14), au-dessus de la scène
  drawSeasonFx(ctx);    // feuilles d'automne (nº16), au-dessus de la scène
  drawAmbient(ctx);     // papillons, oiseaux, scintillements, brume (nº21)

  // Sélecteur de personnage suivi
  if (trackedId !== null) {
    const e = entityMap[trackedId];
    if (e && BOX_SELECTOR_SPRITE.img.complete && BOX_SELECTOR_SPRITE.img.naturalWidth > 0) {
      const S = BOX_SELECTOR_SPRITE.size;
      const T = TILE_SIZE;
      const px = (ipx(e) + 0.5) * T - S / 2;
      const py = (ipy(e) + 0.5) * T - S / 2;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(BOX_SELECTOR_SPRITE.img, 0, 0, S, S, px, py, S, S);
    }
  }
  // Sélecteur de bâtiment
  if (trackedBuildingId !== null) {
    const b = buildings.find(bd => bd.id === trackedBuildingId);
    if (b && BOX_SELECTOR_SPRITE.img.complete && BOX_SELECTOR_SPRITE.img.naturalWidth > 0) {
      const S = BOX_SELECTOR_SPRITE.size;
      const T = TILE_SIZE;
      const px = (b.x + 0.5) * T - S / 2;
      const py = (b.y + 0.5) * T - S / 2;
      ctx.imageSmoothingEnabled = false;
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.drawImage(BOX_SELECTOR_SPRITE.img, 0, 0, S, S, px, py, S, S);
      ctx.restore();
    } else if (!b) {
      trackedBuildingId = null;
    }
  }

  // (Canopée dessinée dans le tri de profondeur ci-dessus — nº9-cœur.)

  // Jour/nuit (nº10) : composé sur la scène monde finale (canopée incluse), sous la transform.
  applyLight(ctx, worldData.width * TILE_SIZE, worldData.height * TILE_SIZE);

  ctx.restore();

  // Météo — couche CIEL en ESPACE-ÉCRAN (précipitations, veils, éclair) : APRÈS restore
  // → remplit le viewport uniformément, densité constante quel que soit le zoom/pan.
  // Dessinée par-dessus la nuit → un éclair illumine bien le monde assombri.
  drawWeatherSky(ctx);

  // Sites nommés (P7 G4) : DERNIÈRE couche monde, au-dessus de tout ce qui se dessine dans la
  // carte et sous tout le HUD. Dessinée APRÈS la météo-ciel : une couche cartographique doit
  // rester lisible sous la pluie (la liste de z-order de Regigigas ne mentionnait pas la météo —
  // choix signalé au gate). En espace ÉCRAN, donc taille fixe quel que soit le zoom.
  drawSites(ctx);
}

// Fête des moissons (P5 E2) — rendu DESSINÉ PAR REGIGIGAS (params exacts : positions/couleurs/
// périodes ; je ne fais que les câbler). Actif quand le clan du feu a le flag wire `feast`. Toutes
// les cotes en unités tuile T, centre = centre de la tuile campfire, t en secondes. Respecte
// prefers-reduced-motion (halo fixe, pas d'oscillation ni d'étincelles).
const FEAST_REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function drawFeast(ctx, T, b, clanCol, now) {
  const t = now / 1000;
  const fx = (b.x + 0.5) * T, fy = (b.y + 0.5) * T;                 // centre du feu
  // HALO radial chaud qui respire
  const a = FEAST_REDUCED ? 0.26 : 0.20 + 0.09 * Math.sin(2.1 * t);
  const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 1.9 * T);
  g.addColorStop(0,    `rgba(251,191,36,${(a + 0.22).toFixed(3)})`);
  g.addColorStop(0.55, `rgba(251,146,60,${a.toFixed(3)})`);
  g.addColorStop(1,    "rgba(251,146,60,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(fx, fy, 1.9 * T, 0, Math.PI * 2); ctx.fill();
  // MÂTS ×3 (offset du PIED depuis le feu), fût bois 2 tons + contour + pommeau or
  const masts = [[-2.1, -0.95], [2.1, -1.1], [0, -1.66]], H = 0.72 * T;
  const tops = masts.map(([ox, oy]) => ({ x: fx + ox * T, y: fy + oy * T - H, by: fy + oy * T }));
  tops.forEach(top => {
    ctx.lineCap = "round";
    ctx.lineWidth = 0.075 * T; ctx.strokeStyle = "#373737";        // contour
    ctx.beginPath(); ctx.moveTo(top.x, top.by); ctx.lineTo(top.x, top.y); ctx.stroke();
    ctx.lineWidth = 0.05 * T;  ctx.strokeStyle = "#93674d";        // fût foncé
    ctx.beginPath(); ctx.moveTo(top.x, top.by); ctx.lineTo(top.x, top.y); ctx.stroke();
    ctx.lineWidth = 0.02 * T;  ctx.strokeStyle = "#d3a061";        // arête claire
    ctx.beginPath(); ctx.moveTo(top.x - 0.012 * T, top.by); ctx.lineTo(top.x - 0.012 * T, top.y); ctx.stroke();
    ctx.fillStyle = "#ebbb00";                                     // pommeau or
    ctx.beginPath(); ctx.arc(top.x, top.y, 0.045 * T, 0, Math.PI * 2); ctx.fill();
  });
  // GUIRLANDES ×2 (mât gauche→central, central→droit), 7 fanions triangulaires par guirlande
  const cols = [clanCol, "#ebbb00", "#f3f4f6"];
  [[0, 2, 0], [2, 1, 2.1]].forEach(([ia, ib, seed]) => {
    const p0 = tops[ia], p1 = tops[ib], midx = (p0.x + p1.x) / 2;
    const sag = Math.max(p0.y, p1.y) + 0.33 * T + (FEAST_REDUCED ? 0 : 0.04 * T * Math.sin(0.8 * t + seed));
    ctx.strokeStyle = "rgba(60,50,40,0.6)"; ctx.lineWidth = Math.max(1, 0.02 * T);
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.quadraticCurveTo(midx, sag, p1.x, p1.y); ctx.stroke();
    for (let i = 1; i <= 7; i++) {
      const u = i / 8, iu = 1 - u;
      const qx = iu * iu * p0.x + 2 * iu * u * midx + u * u * p1.x;
      const qy = iu * iu * p0.y + 2 * iu * u * sag  + u * u * p1.y;
      const tip = FEAST_REDUCED ? 0 : 0.025 * T * Math.sin(2.2 * t + 1.7 * i + seed);
      ctx.fillStyle = cols[(i - 1) % 3];
      ctx.beginPath();
      ctx.moveTo(qx - 0.0625 * T, qy); ctx.lineTo(qx + 0.0625 * T, qy);
      ctx.lineTo(qx + tip, qy + 0.14 * T); ctx.closePath(); ctx.fill();
    }
  });
  // ÉTINCELLES montantes (omises en reduced-motion)
  if (!FEAST_REDUCED) {
    for (let i = 0; i < 14; i++) {
      const u = (0.16 * t + i / 14) % 1;
      const off = (-0.27 + 0.54 * (((i * 5 + 2) % 14) / 13)) * T;   // offset fixe par particule
      const sx = fx + off * (0.4 + u), sy = fy - 0.1 * T - 1.2 * T * u;
      ctx.fillStyle = `rgba(253,224,71,${((1 - u) * 0.8).toFixed(3)})`;
      ctx.fillRect(sx - 0.02 * T, sy - 0.02 * T, 0.04 * T, 0.04 * T);
    }
  }
}

// Vie des bâtiments (refonte nº20) : effets procéduraux par-dessus les sprites (aucun asset
// neuf). Fumée de cheminée + fanion de clan sur les maisons, ailes tournantes des moulins,
// braise+étincelles des forges. Lit `buildings` moteur → hash-neutre.
function drawBuildingFx(ctx, T) {
  if (!buildings.length) return;
  const now = performance.now();
  const clanColor = id => (clans.find(c => c.id === id) || {}).color || "#cccccc";
  buildings.forEach(b => {
    if (b.btype === "house") {
      for (let s = 0; s < 2; s++) {                     // fumée de cheminée
        const cyc = 3200, ph = ((now + s * 1600 + (b.x * 53 + b.y * 29)) % cyc) / cyc;
        const px = (b.x + 0.68) * T + Math.sin(now / 1100 + b.x) * 3 * ph;
        const py = b.y * T - ph * T * 1.8;
        ctx.fillStyle = `rgba(120,116,112,${((1 - ph) * 0.22).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(px, py, T * (0.1 + ph * 0.32), 0, Math.PI * 2); ctx.fill();
      }
      if (b.clan_id != null) {                          // fanion de clan qui claque
        const fx = (b.x + 0.15) * T, fy = b.y * T - T * 0.15;
        const flap = ((now >> 8) & 1) ? T * 0.3 : T * 0.22;
        ctx.strokeStyle = "rgba(90,70,50,0.7)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(fx, fy - T * 0.4); ctx.lineTo(fx, fy + T * 0.05); ctx.stroke();
        ctx.fillStyle = clanColor(b.clan_id);
        ctx.beginPath();
        ctx.moveTo(fx, fy - T * 0.35); ctx.lineTo(fx, fy); ctx.lineTo(fx + flap, fy - T * 0.18);
        ctx.closePath(); ctx.fill();
      }
    } else if (b.btype === "mill") {                    // ailes en rotation (4 bras 2 tons)
      const cx = (b.x + 0.5) * T, cy = (b.y + 0.4) * T, rot = now / 1400, arm = T * 0.42;
      for (let a = 0; a < 4; a++) {
        const ang = rot + a * Math.PI / 2;
        ctx.strokeStyle = a % 2 ? "#d9c9a8" : "#b0966e";
        ctx.lineWidth = Math.max(1.4, T * 0.11);
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * arm, cy + Math.sin(ang) * arm); ctx.stroke();
      }
      ctx.fillStyle = "#6b5535";
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(1.5, T * 0.09), 0, Math.PI * 2); ctx.fill();
    } else if (b.btype === "forge") {                   // braise pulsante + étincelles
      const cx = (b.x + 0.5) * T, cy = (b.y + 0.62) * T, pulse = 0.6 + 0.4 * Math.sin(now / 180 + b.x);
      ctx.fillStyle = `rgba(255,120,20,${(0.5 * pulse).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(cx, cy, T * 0.16 * pulse, 0, Math.PI * 2); ctx.fill();
      for (let s = 0; s < 3; s++) {
        const cyc = 700, ph = ((now + s * 233 + b.x * 40) % cyc) / cyc;
        ctx.fillStyle = `rgba(255,${Math.round(200 - ph * 120)},60,${(1 - ph).toFixed(3)})`;
        ctx.fillRect(Math.round(cx + (s - 1) * 3 * ph), Math.round(cy - ph * T * 0.8), 1, 1);
      }
    } else if (b.btype === "campfire") {                // P5 E2 : fête si le clan festoie (flag wire feast)
      const cl = clans.find(c => c.id === b.clan_id);
      if (cl && cl.feast) drawFeast(ctx, T, b, clanColor(b.clan_id), now);
    }
  });
}

// ── Bâtiments ────────────────────────────────────────────────────────────────
function drawBuildings(c, T) {
  if (!buildings.length) return;
  const S = HOUSE_SPRITE.size;
  buildings.forEach(b => {
    // Chantiers en cours
    if (b.btype.startsWith("site_")) {
      if (!HOUSE_WIP_SPRITE.img.complete || !HOUSE_WIP_SPRITE.img.naturalWidth) return;
      c.drawImage(HOUSE_WIP_SPRITE.img,
                  HOUSE_WIP_SPRITE.col * S, HOUSE_WIP_SPRITE.row * S, S, S,
                  b.x * T, b.y * T, T, T);
      // Barre de progression
      const pct = b.work_needed > 0 ? (b.work_done ?? 0) / b.work_needed : 0;
      c.fillStyle = "rgba(0,0,0,0.5)";
      c.fillRect(b.x * T, (b.y + 1) * T - 3, T, 3);
      c.fillStyle = "#4ade80";
      c.fillRect(b.x * T, (b.y + 1) * T - 3, T * pct, 3);
      return;
    }
    if (b.btype === "house") {
      // Hutte colorée du clan (nº22) → village distinct. Le strip 5×1 : col 0 = panneau/étal
      // VIDE (pas une maison, Regigigas) → L1 = cols 1-3 (3 variantes), L2 = col 4 (hutte à
      // fenêtre éclairée, lisible comme upgrade). clan_id = index CLAN_HUT_SPRITES (cf. mapping).
      const hut = b.clan_id != null ? CLAN_HUT_SPRITES[((b.clan_id - 1) % 4 + 4) % 4] : null;
      if (hut && hut.img.complete && hut.img.naturalWidth > 0) {
        const hc = b.level >= 2 ? 4 : 1 + (b.x * 7 + b.y * 13) % 3;
        c.drawImage(hut.img, hc * S, 0, S, S, b.x * T, b.y * T, T, T);
      } else {
        if (!HOUSE_SPRITE.img.complete || !HOUSE_SPRITE.img.naturalWidth) return;
        const sp = b.level >= 2 ? HOUSE_L2_SPRITE : HOUSE_SPRITE;
        c.drawImage(sp.img, sp.col * S, sp.row * S, S, S, b.x * T, b.y * T, T, T);
      }
      // Stock de bois + pierre + badge L2
      const labels = [];
      if (b.wood  > 0) labels.push(`🪵${Math.floor(b.wood)}`);
      if (b.stone > 0) labels.push(`🪨${b.stone}`);
      if (b.level >= 2) labels.push("★");
      if (labels.length) {
        c.font = `${Math.max(5, T * 0.52)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = b.level >= 2 ? "#93c5fd" : "#fde68a";
        c.fillText(labels.join(" "), (b.x + 0.5) * T, b.y * T - 1);
      }
    } else if (b.btype === "mill") {
      if (!MILL_IMG.complete || !MILL_IMG.naturalWidth) return;
      const S = MILL_SPRITE.size;
      c.drawImage(MILL_SPRITE.img, MILL_SPRITE.col * S, MILL_SPRITE.row * S, S, S,
                  b.x * T, b.y * T, T, T);
      // Labels : blé stocké + pains prêts
      const labels = [];
      if (b.wheat > 0) labels.push(`🌾${b.wheat}`);
      if (b.bread > 0) labels.push(`🍞${b.bread}`);
      if (b.level >= 2) labels.push("★");   // P6 F4 : moulin L2 = GRENIER (stock ×3)
      if (labels.length) {
        c.font = `${Math.max(5, T * 0.52)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = "#fde68a";
        c.fillText(labels.join(" "), (b.x + 0.5) * T, b.y * T - 1);
      }
    } else if (b.btype === "well") {
      if (!WELL_IMG.complete || !WELL_IMG.naturalWidth) return;
      const S = WELL_SPRITE.size;
      c.drawImage(WELL_SPRITE.img, WELL_SPRITE.col * S, WELL_SPRITE.row * S, S, S,
                  b.x * T, b.y * T, T, T);
    } else if (b.btype === "wheatfield") {
      if (!WHEAT_IMG.complete || !WHEAT_IMG.naturalWidth) return;
      const stage = Math.min(4, Math.max(1, b.stage || 1));
      const sp = WHEAT_SPRITES[stage - 1];
      if (stage >= 3) {
        // Blé mûr (nº18) : la cime (épis, haut ~55 %) ondule au vent, la tige reste fixe →
        // vague qui roule sur le champ (phase par position, cf. windShift).
        const wob = windShift(performance.now(), b.x * 3 + b.y * 5) * 0.6;
        const cut = Math.round(S * 0.55), th = cut / S * T;
        c.drawImage(sp.img, sp.col * S, sp.row * S, S, cut, b.x * T + wob, b.y * T, T, th);
        c.drawImage(sp.img, sp.col * S, sp.row * S + cut, S, S - cut, b.x * T, b.y * T + th, T, T - th);
      } else {
        c.drawImage(sp.img, sp.col * S, sp.row * S, S, S, b.x * T, b.y * T, T, T);
      }
      // Indicateur arrosé — petit carré bleu en haut à gauche
      if (b.watered) {
        c.fillStyle = "#38bdf8";
        c.fillRect(b.x * T, b.y * T, T * 0.25, T * 0.25);
      }
      // Badge mûr
      if (stage >= 4) {
        c.font = `${Math.max(5, T * 0.55)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = "#fbbf24";
        c.fillText("🌾", (b.x + 0.5) * T, b.y * T - 1);
      }
    } else if (b.btype === "market") {
      // Marché (D1) : étal procédural — poteaux + auvent rayé + comptoir,
      // piles de bois/pierre proportionnelles au stock (les imports fondent à vue).
      c.fillStyle = "#7c5a3a";                                       // poteaux
      c.fillRect(b.x * T + T * 0.12, b.y * T + T * 0.25, T * 0.08, T * 0.6);
      c.fillRect(b.x * T + T * 0.80, b.y * T + T * 0.25, T * 0.08, T * 0.6);
      const cnM = clans.find(cc => cc.id === b.clan_id);
      const awn = cnM ? cnM.color : "#e5e7eb";
      for (let i = 0; i < 4; i++) {                                  // auvent rayé
        c.fillStyle = i % 2 ? "#f3f4f6" : awn;
        c.fillRect(b.x * T + T * (0.08 + i * 0.21), b.y * T + T * 0.16, T * 0.21, T * 0.14);
      }
      c.fillStyle = "#8B5A2B";                                       // comptoir
      c.fillRect(b.x * T + T * 0.16, b.y * T + T * 0.58, T * 0.68, T * 0.14);
      const wpile = Math.min(1, (b.wood ?? 0) / 40), spile = Math.min(1, (b.stone ?? 0) / 40);
      if (wpile > 0) {                                               // pile de bois
        c.fillStyle = "#a16207";
        c.fillRect(b.x * T + T * 0.18, b.y * T + T * (0.90 - 0.16 * wpile), T * 0.24, T * 0.16 * wpile);
      }
      if (spile > 0) {                                               // pile de pierre
        c.fillStyle = "#94a3b8";
        c.fillRect(b.x * T + T * 0.58, b.y * T + T * (0.90 - 0.16 * spile), T * 0.24, T * 0.16 * spile);
      }
      // Board de cours (D2) : ce qui est affiché est ce qui est négocié
      const quotes = [];
      if ((b.rs ?? 0) > 0) quotes.push({ txt: `🪨${b.rs}`, col: b.rs >= 12 ? "#f1c40f" : b.rs >= 9 ? "#fb923c" : "#9ca3af" });
      if ((b.ri ?? 0) > 0) quotes.push({ txt: `⛓${b.ri}`, col: b.ri >= 3 ? "#f1c40f" : "#9ca3af" });
      if ((b.gold ?? 0) > 0) quotes.push({ txt: `🪙${b.gold}`, col: "#fcd34d" });   // P6 F1 : coffre d'or du marché
      if (quotes.length) {
        c.font = `${Math.max(5, T * 0.5)}px monospace`;
        c.textAlign = "center";
        quotes.forEach((q, i) => {
          c.fillStyle = q.col;
          c.fillText(q.txt, (b.x + 0.5) * T, b.y * T - 2 - i * T * 0.55);
        });
      }
      const wants = [];
      if (b.ws) wants.push("🪨?");
      if (b.wi) wants.push("⛓?");
      if (wants.length) {
        c.font = `${Math.max(5, T * 0.45)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = cnM ? cnM.color : "#e5e7eb";
        c.fillText(wants.join(" "), (b.x + 0.5) * T, (b.y + 1) * T + T * 0.5);
      }
    } else if (b.btype === "church") {
      // Église (C1) : corps pierre, clocher + croix couleur clan, vitrail, cierges.
      const cnC = clans.find(cc => cc.id === b.clan_id);
      c.fillStyle = "#9ca3af";                                       // corps pierre
      c.fillRect(b.x * T + T * 0.15, b.y * T + T * 0.38, T * 0.70, T * 0.52);
      c.fillStyle = "#6b7280";                                       // clocher
      c.fillRect(b.x * T + T * 0.38, b.y * T + T * 0.06, T * 0.24, T * 0.36);
      c.strokeStyle = cnC ? cnC.color : "#e5e7eb";                   // croix
      c.lineWidth = Math.max(1, T * 0.06);
      c.beginPath();
      c.moveTo((b.x + 0.5) * T, b.y * T - T * 0.14);
      c.lineTo((b.x + 0.5) * T, b.y * T + T * 0.06);
      c.moveTo((b.x + 0.5) * T - T * 0.08, b.y * T - T * 0.07);
      c.lineTo((b.x + 0.5) * T + T * 0.08, b.y * T - T * 0.07);
      c.stroke();
      c.fillStyle = "#7dd3fc";                                       // vitrail
      c.fillRect(b.x * T + T * 0.44, b.y * T + T * 0.52, T * 0.12, T * 0.18);
      // Cierges : la pile d'offrandes FOND à vue (flicker sinusoïdal)
      const candles = Math.min(6, b.wood ?? 0);
      for (let i = 0; i < candles; i++) {
        const fl = 0.6 + 0.4 * Math.sin((currentTick * 3 + i * 7) * 0.3);
        c.fillStyle = `rgba(251,191,36,${fl})`;
        c.fillRect(b.x * T + T * (0.10 + i * 0.14), (b.y + 1) * T - T * 0.10, T * 0.06, T * 0.10);
      }
      if ((b.pil ?? 0) > 0) {                                        // renommée
        c.font = `${Math.max(5, T * 0.45)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = "#fcd34d";
        c.fillText(`✦${b.pil}`, (b.x + 0.5) * T, b.y * T - T * 0.3);
      }
      if ((b.gold ?? 0) > 0) {                                       // label trésor (C2)
        c.font = `${Math.max(5, T * 0.45)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = "#fcd34d";
        c.fillText(`🪙${b.gold}`, (b.x + 0.5) * T, b.y * T - T * 0.85);
      }
      // Trésor (C2) : pile de pièces VERTICALE sur le flanc droit
      const coins = Math.min(6, b.gold ?? 0);
      for (let i = 0; i < coins; i++) {
        const gl = 0.6 + 0.4 * Math.sin((currentTick * 2 + i * 5) * 0.3);
        c.fillStyle = `rgba(252,211,77,${gl})`;
        c.fillRect(b.x * T + T * 0.78, b.y * T + T * (0.82 - i * 0.09), T * 0.10, T * 0.07);
      }
      // Dorure (C2) : le puits VISIBLE — croix et arête redorées, reflet pulsant
      if ((b.gilt ?? 0) > 0) {
        c.save();
        c.globalAlpha = 0.5 + 0.35 * Math.sin(currentTick * 0.2);
        c.strokeStyle = "#fcd34d";
        c.lineWidth = Math.max(1, T * 0.07);
        c.beginPath();
        c.moveTo((b.x + 0.5) * T, b.y * T - T * 0.14);
        c.lineTo((b.x + 0.5) * T, b.y * T + T * 0.06);
        c.moveTo((b.x + 0.5) * T - T * 0.08, b.y * T - T * 0.07);
        c.lineTo((b.x + 0.5) * T + T * 0.08, b.y * T - T * 0.07);
        c.moveTo(b.x * T + T * 0.15, b.y * T + T * 0.38);
        c.lineTo(b.x * T + T * 0.85, b.y * T + T * 0.38);
        c.stroke();
        c.restore();
      }
    } else if (b.btype === "forge") {
      // Forge (bloc B) : enclume sombre sur socle, braise orange — procédural.
      c.fillStyle = "#374151";                                        // socle
      c.fillRect(b.x * T + T * 0.10, b.y * T + T * 0.55, T * 0.80, T * 0.35);
      c.fillStyle = "#1f2937";                                        // corps enclume
      c.fillRect(b.x * T + T * 0.22, b.y * T + T * 0.30, T * 0.56, T * 0.28);
      c.fillStyle = "#f97316";                                        // braise
      c.fillRect(b.x * T + T * 0.40, b.y * T + T * 0.62, T * 0.20, T * 0.14);
      // Label : fer stocké
      if ((b.iron ?? 0) > 0) {
        c.font = `${Math.max(5, T * 0.52)}px monospace`;
        c.textAlign = "center";
        c.fillStyle = "#cbd5e1";
        c.fillText(`⛓${b.iron}`, (b.x + 0.5) * T, b.y * T - 1);
      }
    } else if (b.btype === "monument") {
      // Monument de prestige (P5 E3) — planche Regigigas « statue du héros ». Colonne = couleur du
      // clan (col0 neutre, cols 1-4 = CLAN_COLORS via ((clan_id-1)%4+4)%4). ANCRAGE BAS : la source
      // 16x32 se pose de (b.y-1)*T sur 2*T de haut → emprise tuile b.y + débord 1 tuile au-dessus
      // (comme la croix d'église ; les entités passent dessous, cohérent).
      if (!MONUMENT_SPRITE.img.complete || !MONUMENT_SPRITE.img.naturalWidth) return;
      const mcol = b.clan_id != null ? 1 + (((b.clan_id - 1) % 4 + 4) % 4) : 0;
      c.drawImage(MONUMENT_SPRITE.img, mcol * 16, 0, 16, 32, b.x * T, (b.y - 1) * T, T, 2 * T);
    } else if (b.btype === "ruin") {
      // Ruine d'un clan éteint (E8) : gravats gris, s'estompent en fin de vie.
      const life = Math.max(0, Math.min(1, (b.ruin_ticks ?? 2500) / 2500));
      const a = 0.35 + 0.5 * life;   // fondu quand la nature reprend la ruine
      c.save();
      c.globalAlpha = a;
      c.fillStyle = "#4b5563";       // pierre grise
      // deux pans de mur brisés + un tas de gravats
      c.fillRect(b.x * T + T * 0.12, b.y * T + T * 0.45, T * 0.22, T * 0.45);
      c.fillRect(b.x * T + T * 0.58, b.y * T + T * 0.30, T * 0.24, T * 0.60);
      c.fillStyle = "#6b7280";
      c.fillRect(b.x * T + T * 0.30, b.y * T + T * 0.68, T * 0.42, T * 0.22);
      c.restore();
    }
  });
}

// ── Souches d'arbres ─────────────────────────────────────────────────────────
function drawStumps(c) {
  if (stumps.size === 0) return;
  const T = TILE_SIZE;
  const forestSp  = BIOME_SPRITES[2];
  const treesImg  = forestSp.overlay.img;
  stumps.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    // Redessine le sol forêt (même logique déterministe que buildBiomeCache)
    const v  = (x * 7 + y * 13) % (forestSp.cols * forestSp.rows);
    const tc = forestSp.col0 + (v % forestSp.cols);
    const tr = (forestSp.row0 || 0) + Math.floor(v / forestSp.cols);
    c.drawImage(forestSp.img, tc * T, tr * T, T, T, x * T, y * T, T, T);
    // Sprite souche : Trees.png tuile (0, 0)
    c.drawImage(treesImg, 0, 0, T, T, x * T, y * T, T, T);
  });
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
function updateSidebar() {
  const pops = stats.populations || {};
  const total = stats.total || 1;
  let html = "";
  Object.entries(SPECIES).forEach(([key, sp]) => {
    const count = pops[key] || 0;
    const pct   = Math.round((count / Math.max(total, 1)) * 100);
    const barW  = Math.round((count / Math.max(total, 1)) * 60);
    html += `
      <div class="pop-row">
        <div class="pop-dot" style="background:${sp.color}"></div>
        <span class="pop-name">${sp.label}</span>
        <div class="pop-bar-wrap"><div class="pop-bar" style="width:${barW}px;background:${sp.color}"></div></div>
        <span class="pop-count">${count}</span>
      </div>`;
  });
  document.getElementById("pop-list").innerHTML = html;
  drawPopChart();
}

// ── Mini graphe linéaire ─────────────────────────────────────────────────────
function drawPopChart() {
  const c  = document.getElementById("pop-chart");
  const cx = c.getContext("2d");
  const W  = c.width = c.offsetWidth;
  const H  = c.height = 80;
  cx.clearRect(0, 0, W, H);

  if (history.length < 2) return;
  const keys  = Object.keys(SPECIES);
  const slice = history.slice(-120);
  const maxV  = Math.max(...slice.map(h => h.populations ? Math.max(...Object.values(h.populations)) : 0), 1);

  keys.forEach(key => {
    const color = SPECIES[key].color;
    cx.beginPath();
    cx.strokeStyle = color;
    cx.lineWidth   = 1.2;
    slice.forEach((h, i) => {
      const v = h.populations?.[key] || 0;
      const x = (i / (slice.length - 1)) * W;
      const y = H - (v / maxV) * (H - 4) - 2;
      i === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
    });
    cx.stroke();
  });
}

  "chop", "mine", "eat_bread", "fish_catch",

  "clan_defect",
  // P7 G3 (finding d'audit F5) : on ne raconte pas une INTENTION de partir ni un renoncement —
  // seule l'arrivée fait date, et elle a son propre handler. Sans cette entrée les deux
  // tombaient dans le JSON.stringify final et s'affichaient en brut dans le feed.
  "clan_migration_start", "clan_migration_failed",

  "trade_aborted",

  "expedition_depart", "expedition_lost",

  "clan_allies", "clan_rivals",
]);
