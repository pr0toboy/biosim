<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioSim — Simulation de vie</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: #1a1d2e;
    border-bottom: 1px solid #2d3248;
    flex-shrink: 0;
  }
  #header h1 { font-size: 18px; font-weight: 600; color: #7c88ff; }
  #tick-label { font-size: 13px; color: #8892b0; }

  .ctrl-btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #3d4268;
    background: #252840;
    color: #c9d1f0;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }
  .ctrl-btn:hover { background: #323660; }
  .ctrl-btn.active { background: #4a5299; border-color: #7c88ff; color: #fff; }

  #speed-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8892b0; }
  #speed-val  { min-width: 32px; text-align: right; color: #c9d1f0; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  .dot.paused { background: #f97316; }

  /* ── Layout principal ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Canvas ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }
  #world-canvas {
    display: block;
    image-rendering: pixelated;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    background: #1a1d2e;
    border-left: 1px solid #2d3248;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .panel {
    padding: 12px 14px;
    border-bottom: 1px solid #2d3248;
  }
  .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase;
              letter-spacing: .08em; color: #5a6380; margin-bottom: 10px; }

  /* ── Populations ── */
  .pop-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .pop-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .pop-name { flex: 1; color: #c9d1f0; }
  .pop-count{ font-weight: 600; color: #e2e8f0; min-width: 30px; text-align: right; }
  .pop-bar-wrap { width: 60px; height: 6px; background: #252840; border-radius: 3px; }
  .pop-bar  { height: 6px; border-radius: 3px; transition: width .4s ease; }

  /* ── Mini graphe population ── */
  #pop-chart { width: 100%; height: 80px; }

  /* ── Event log ── */
  #event-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
  }
  #event-log::-webkit-scrollbar { width: 4px; }
  #event-log::-webkit-scrollbar-thumb { background: #3d4268; border-radius: 2px; }

  .ev-item {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    border-left: 3px solid transparent;
    background: #1e2236;
    color: #8892b0;
    animation: fadeIn .3s ease;
  }
  .ev-item.birth  { border-color: #22c55e; color: #86efac; }
  .ev-item.death  { border-color: #ef4444; color: #fca5a5; }
  .ev-item.kill   { border-color: #f97316; color: #fdba74; }
  .ev-item.chop       { border-color: #8B4513; color: #d4a574; }
  .ev-item.build_house{ border-color: #fbbf24; color: #fde68a; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

  /* Chroniques (bloc K) : annales du monde, entrées datées */
  .chron-item {
    font-size: 11px;
    padding: 4px 8px;
    margin-bottom: 3px;
    border-radius: 4px;
    border-left: 3px solid #6d5aa8;
    background: #1b1f33;
    color: #b7aee0;
    animation: fadeIn .3s ease;
  }
  .chron-item .chron-date { color: #6c7293; font-size: 10px; margin-right: 5px; }
  .chron-item.age     { border-color: #a78bfa; color: #cdbcf5; }
  .chron-item.extinct { border-color: #6b7280; color: #9ca3af; }
  .chron-item.species { border-color: #ef4444; color: #f0a5a5; }
  .chron-item.iron    { border-color: #94a3b8; color: #d3dce6; }
  .chron-item.weather { border-color: #f59e0b; color: #fcd34d; }
  .chron-item.trade   { border-color: #f1c40f; color: #fde68a; }
  .chron-item.faith   { border-color: #aed6f1; color: #d6eaf8; }
  .chron-item.build   { border-color: #fbbf24; color: #fde68a; }

  /* ── Tooltip entité ── */
  #tooltip {
    position: absolute;
    background: #1a1d2e;
    border: 1px solid #3d4268;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #c9d1f0;
    pointer-events: none;
    display: none;
    z-index: 10;
    min-width: 130px;
  }
  #tooltip b { color: #e2e8f0; font-size: 13px; display: block; margin-bottom: 4px; }
  #tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }

  /* ── Système ── */
  .sys-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 12px;
  }
  .sys-label { color: #8892b0; width: 42px; flex-shrink: 0; }
  .sys-bar-wrap { flex: 1; height: 5px; background: #252840; border-radius: 3px; }
  .sys-bar { height: 5px; border-radius: 3px; transition: width .5s ease, background .5s; }
  .sys-val { font-weight: 600; color: #e2e8f0; min-width: 38px; text-align: right; font-size: 11px; }

  /* ── Panneau bâtiment sélectionné ── */
  #building-panel {
    position: absolute;
    bottom: 12px;
    left: 12px;
    background: #1a1d2e;
    border: 1px solid #3d4268;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #c9d1f0;
    display: none;
    z-index: 10;
    min-width: 170px;
    pointer-events: none;
  }
  #building-panel b { color: #e2e8f0; font-size: 13px; display: block; margin-bottom: 6px; }
  #building-panel .tt-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 3px; }

  /* ── Status bar ── */
  #statusbar {
    font-size: 11px;
    color: #5a6380;
    padding: 4px 16px;
    background: #0f1117;
    border-top: 1px solid #1a1d2e;
    flex-shrink: 0;
  }

  /* ── Mobile ── */
  #world-canvas { touch-action: none; }

  @media (max-width: 640px) {
    #header {
      flex-wrap: wrap;
      padding: 6px 10px;
      gap: 8px;
      row-gap: 6px;
    }
    #header h1 { font-size: 15px; }
    #tick-label, #total-label { font-size: 12px; }
    .ctrl-btn { padding: 7px 14px; font-size: 14px; min-height: 36px; }
    #speed-wrap { font-size: 12px; }
    #speed-wrap input[type=range] { width: 70px; }

    #main { flex-direction: column; }

    #sidebar {
      width: 100%;
      border-left: none;
      border-top: 1px solid #2d3248;
      flex-direction: row;
      flex-wrap: wrap;
      max-height: 190px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #sidebar .panel {
      flex: 1;
      min-width: 150px;
      border-bottom: none;
      border-right: 1px solid #2d3248;
    }
    /* Masquer le log d'événements sur mobile */
    #sidebar .panel:last-child { display: none; }
    #pop-chart { height: 60px; }
  }
</style>
</head>
<body>

<div id="header">
  <div class="dot" id="status-dot"></div>
  <h1>🌍 BioSim</h1>
  <span id="tick-label">Tick 0</span>
  <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ Pause</button>
  <div id="speed-wrap">
    Vitesse
    <input type="range" id="speed-slider" min="1" max="20" value="2"
           oninput="setSpeed(this.value)" style="width:90px">
    <span id="speed-val">2×</span>
  </div>
  <span id="season-label" style="font-size:13px;color:#c9d1f0;font-weight:500"></span>
  <span id="temp-label" style="font-size:13px;font-weight:600;margin-left:8px"></span>
  <span style="flex:1"></span>
  <span id="total-label" style="font-size:13px;color:#8892b0"></span>
</div>

<div id="main">
  <div id="canvas-wrap">
    <canvas id="world-canvas"></canvas>
    <div id="tooltip"></div>
    <div id="building-panel"></div>
  </div>

  <div id="sidebar">
    <div class="panel">
      <h2>Populations</h2>
      <div id="pop-list"></div>
    </div>
    <div class="panel">
      <h2>Évolution</h2>
      <canvas id="pop-chart"></canvas>
    </div>
    <div class="panel">
      <h2>Système</h2>
      <div class="sys-row">
        <span class="sys-label">CPU</span>
        <div class="sys-bar-wrap"><div class="sys-bar" id="sys-cpu-bar" style="width:0%"></div></div>
        <span class="sys-val" id="sys-cpu-val">—</span>
      </div>
      <div class="sys-row">
        <span class="sys-label">RAM</span>
        <div class="sys-bar-wrap"><div class="sys-bar" id="sys-ram-bar" style="width:0%"></div></div>
        <span class="sys-val" id="sys-ram-val">—</span>
      </div>
      <div class="sys-row">
        <span class="sys-label">Temp</span>
        <div class="sys-bar-wrap"><div class="sys-bar" id="sys-temp-bar" style="width:0%"></div></div>
        <span class="sys-val" id="sys-temp-val">—</span>
      </div>
    </div>
    <div class="panel" style="max-height:28%;overflow:hidden;display:flex;flex-direction:column;">
      <h2>📜 Chroniques</h2>
      <div id="chronicle-log" style="overflow-y:auto;flex:1;"></div>
    </div>
    <div class="panel" style="flex:1;overflow:hidden;display:flex;flex-direction:column;border-bottom:none;">
      <h2>Événements</h2>
      <div id="event-log"></div>
    </div>
  </div>
</div>

<div id="statusbar" id="statusbar">Connexion…</div>

<script>
// ── Config espèces ──────────────────────────────────────────────────────────
const SPECIES = {
  boar:         { label: "Sangliers",  art: "un sanglier",  pl: "sangliers",  color: "#8B4513", base: [1.2,  8, 0.11 ] },
  chicken:      { label: "Poules",     art: "une poule",    pl: "poules",     color: "#f39c12", base: [0.7,  4, 0.06  ] },
  horned_sheep: { label: "Boucs",      art: "un bouc",      pl: "boucs",      color: "#c0a080", base: [0.85, 6, 0.07  ] },
  horse:        { label: "Chevaux",    art: "un cheval",    pl: "chevaux",    color: "#a0826d", base: [1.5,  7, 0.07  ] },
  human:        { label: "Humains",    art: "un humain",    pl: "humains",    color: "#f4d03f", base: [1.0,  8, 0.08  ] },
  pig:          { label: "Cochons",    art: "un cochon",    pl: "cochons",    color: "#f1948a", base: [0.8,  5, 0.06  ] },
  sheep:        { label: "Moutons",    art: "un mouton",    pl: "moutons",    color: "#ecf0f1", base: [0.9,  6, 0.055 ] },
  fish:         { label: "Poissons",   art: "un poisson",   pl: "poissons",   color: "#5dade2", base: [0.8,  5, 0.045 ] },
  shark:        { label: "Requins",    art: "un requin",    pl: "requins",    color: "#1a5276", base: [1.2, 14, 0.025 ] },
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const STATE_ICONS = {
  idle: "·", wandering: "↝", seeking_food: "🌿",
  eating: "🍴", fleeing: "!", hunting: "⚔",
  seeking_mate: "♥", chopping: "🪓", building: "🏗", farming: "🌾", resting: "z",
  seeking_water: "💧", drinking: "🥤", mining: "⛏", exploring: "🧭",
  trading: "🐫", praying: "🙏", pilgrimage: "🚶", dead: "✝"
};

// ── Sprites terrain ──────────────────────────────────────────────────────────
const TILE_SIZE = 16;

// Sprites par biome : fichier PNG + col0 (colonne de départ), cols/rows utilisés
// Shore.png layout : col0=sable, col1=eau/sable, col2=peu profonde, col3=normale, col4=profonde
const BIOME_SPRITES = {
  0: { img: new Image(), src: "/static/MiniWorldSprites/Ground/Shore.png", // col 3=normale (bord), col 4=profonde (milieu)
     overlay: { img: new Image(), src: "/static/MiniWorldSprites/Ground/free_pixel_16_woods.png", col0: 14, cols: 3, rows: 1, row0: 7, density: 4 } },
  // Plaine (nº5) : base à prairies nuancées (rendu spécial biome 1, cf. plaineRow) ; arbres
  // épars montés dans la canopée nº7 ; overlays = fleurs + litière (champignons/rocher/
  // rondin/buissons). row0/cols du base ignorés ici (tc/tr calculés par plaineRow).
  1: { img: new Image(), src: "/static/MiniWorldSprites/Ground/TexturedGrass.png",  col0: 0, cols: 3, rows: 2, row0: 0,
     overlay: [
       { img: new Image(), src: "/static/MiniWorldSprites/Nature/Basic_Grass_Biom_things.png", col0: 6, cols: 1, rows: 2, row0: 2, density: 3 },
       { img: new Image(), src: "/static/refonte/plain_extra.png", col0: 0, cols: 5, rows: 1, density: 0.6 },
     ] },
  // Forêt (refonte nº7) : sol sombre + litière (champignons/rondins/souche) ; les arbres
  // debout sont dans la couche canopée (32px, dessinée APRÈS les entités = look WorldBox).
  2: { img: new Image(), src: "/static/refonte/floor_dark.png", col0: 0, cols: 3, rows: 1,
     overlay: { img: new Image(), src: "/static/refonte/forest_floor.png", col0: 0, cols: 4, rows: 1, density: 1.2 } },
  // Désert (nº3) : sable TEXTURÉ (3 variantes, même grain que l'herbe, palette sable) au
  // lieu du sable plat Shore col0. Cactus conservés.
  3: { img: new Image(), src: "/static/refonte/sand_tex.png", col0: 0, cols: 3, rows: 1,
     overlay: { img: new Image(), src: "/static/MiniWorldSprites/Nature/Cactus.png", col0: 0, cols: 4, rows: 2, density: 2 } },
  4: { img: new Image(), src: "/static/MiniWorldSprites/Ground/Winter.png",         col0: 5, cols: 1, rows: 1,
     overlay: { img: new Image(), src: "/static/MiniWorldSprites/Nature/Rocks.png", col0: 0, cols: 3, rows: 4, density: 5 } },
  5: { img: new Image(), src: "/static/MiniWorldSprites/Ground/Shore.png",         col0: 2, cols: 1, rows: 1 }, // eau peu profonde (rivières)
  6: { img: new Image(), src: "/static/MiniWorldSprites/Ground/DeadGrass.png",     col0: 0, cols: 2, rows: 1 }, // terre battue (surpâturage)
};

// Planches d'arbres de la CANOPÉE (refonte nº7) — dérivées générées par
// tools/build_refonte_forest.py. Contours noirs remappés vert feuille (le trait double
// d'épaisseur au dessin ×2), things_g = feuillus 2×2 remappés palette du jeu.
const TREE_SPRITES = {
  treesSoft:       { img: new Image(), src: "/static/refonte/trees_soft.png" },
  forestTreesSoft: { img: new Image(), src: "/static/refonte/forest_trees_soft.png" },
  thingsG:         { img: new Image(), src: "/static/refonte/things_g.png" },
};
// Autotile de falaise (refonte nº2) — Cliff.png (7×9). Bloc 3×3 (0,0)-(2,2) = étage 1,
// (0,3)-(2,5) = étage 2 ; tuile choisie par voisinage (comme l'eau), herbe dessous.
const CLIFF_SPRITE = { img: new Image(), src: "/static/MiniWorldSprites/Ground/Cliff.png" };
// Palmiers d'oasis (refonte nº3, cols 2-5) — canopée sur l'anneau de sable autour de l'eau.
const PALM_SPRITE = { img: new Image(), src: "/static/MiniWorldSprites/Nature/CoconutTrees.png" };
// Paliers d'eau profonde (refonte nº4) — Shore col4 assombri ×0.84 (col0) et ×0.68 (col1).
const DEEPS_SPRITE = { img: new Image(), src: "/static/refonte/deep_water.png" };
// Tuiles de mélange de frontière (refonte nº6) — herbe↔sable (col0), herbe↔terre (col1).
const BLENDS_SPRITE = { img: new Image(), src: "/static/refonte/blends.png" };

// Sprite feu de camp (centre de clan)
const CAMPFIRE_SPRITE = { img: new Image(), src: "/static/MiniWorldSprites/Buildings/campfire.png", col: 0, row: 0, size: 16 };
// Sprite maison (bâtiment construit)
const HOUSE_SPRITE          = { img: new Image(), src: "/static/MiniWorldSprites/Buildings/Wood/Houses.png", col: 1, row: 1, size: 16 };
const HOUSE_L2_SPRITE       = { img: HOUSE_SPRITE.img, col: 1, row: 3, size: 16 };
const HOUSE_WIP_SPRITE      = { img: HOUSE_SPRITE.img, col: 1, row: 0, size: 16 };
const BOX_SELECTOR_SPRITE   = { img: new Image(), src: "/static/MiniWorldSprites/User Interface/BoxSelector.png", size: 16 };
// Sprite champ de blé : 4 stades, Wheatfield.png tuiles (0,0)→(3,0)
const WHEAT_IMG = new Image();
WHEAT_IMG.src = "/static/MiniWorldSprites/Nature/Wheatfield.png";
const WHEAT_SPRITES = [0,1,2,3].map(col => ({ img: WHEAT_IMG, col, row: 0, size: 16 }));
// Sprite moulin : Resources.png tuile (1,1)
const MILL_IMG = new Image();
MILL_IMG.src = "/static/MiniWorldSprites/Buildings/Wood/Resources.png";
const MILL_SPRITE = { img: MILL_IMG, col: 1, row: 1, size: 16 };
// Sprite puit : Well.png tuile (2,1)
const WELL_IMG    = new Image();
const WELL_SPRITE = { img: WELL_IMG, src: "/static/MiniWorldSprites/Miscellaneous/Well.png", col: 2, row: 1, size: 16 };

// Sprites par espèce : col/row = tuile pose frontale, size = taille px de la tuile source
const ENTITY_SPRITES = {
  boar:         { img: new Image(), src: "/static/MiniWorldSprites/Animals/Boar.png",          col: 0, row: 0, size: 16 },
  chicken:      { img: new Image(), src: "/static/MiniWorldSprites/Animals/Chicken.png",       col: 0, row: 0, size: 16 },
  horned_sheep: { img: new Image(), src: "/static/MiniWorldSprites/Animals/HornedSheep.png",  col: 0, row: 0, size: 16 },
  horse:        { img: new Image(), src: "/static/MiniWorldSprites/Animals/Horse(32x32).png",                    col: 0, row: 0, size: 32 },
  human:        { img: new Image(), src: "/static/MiniWorldSprites/Characters/Workers/FarmerTemplate.png",       col: 1, row: 0, size: 16 },
  human_chief:  { img: new Image(), src: "/static/MiniWorldSprites/Characters/Champions/Kanji.png",              col: 0, row: 0, size: 16 },
  pig:          { img: new Image(), src: "/static/MiniWorldSprites/Animals/Pig.png",                             col: 0, row: 0, size: 16 },
  sheep:        { img: new Image(), src: "/static/MiniWorldSprites/Animals/Sheep.png",         col: 0, row: 0, size: 16 },
  fish:         { img: new Image(), src: "/static/MiniWorldSprites/Animals/MarineAnimals.png", col: 2, row: 2, size: 16 },
  // Requin : sprite 3×4 tuiles (cols 53-55, rows 4-7), hitbox = tiles (54,5)+(54,6)
  // Centre du hitbox = centre du sprite → drawImage centré sur entity position
  shark:        { img: new Image(), src: "/static/MiniWorldSprites/Animals/shark.png",
                  col: 53, row: 4, size: 16,
                  srcCols: 3, srcRows: 4,   // source 3×4 tuiles
                  dstW: 3,   dstH: 4 },     // affiché 3T×4T (maintien ratio source)
};

// Marche animée (refonte nº1) — planches 4×4 standard (rows 0-3 = down/up/left/right,
// 4 frames de marche). ⚠ gauche/droite DIFFÈRENT par espèce (piège « animaux à l'envers »):
// chicken + fermier = left:2/right:3 ; sheep/horned_sheep/pig/boar = left:3/right:2.
// human_chief (Kanji 6×8, layout distinct), fish/shark (aquatique), horse (32px) NON animés
// ici → frame fixe (follow-up). Immobile → frame idle (identique à la frame fixe actuelle).
const ENTITY_ANIM = {
  chicken:      { cols: [0, 1, 2, 3], rows: { down: 0, up: 1, left: 2, right: 3 }, idle: { c: 0, r: 0 } },
  sheep:        { cols: [0, 1, 2, 3], rows: { down: 0, up: 1, left: 3, right: 2 }, idle: { c: 0, r: 0 } },
  horned_sheep: { cols: [0, 1, 2, 3], rows: { down: 0, up: 1, left: 3, right: 2 }, idle: { c: 0, r: 0 } },
  pig:          { cols: [0, 1, 2, 3], rows: { down: 0, up: 1, left: 3, right: 2 }, idle: { c: 0, r: 0 } },
  boar:         { cols: [0, 1, 2, 3], rows: { down: 0, up: 1, left: 3, right: 2 }, idle: { c: 0, r: 0 } },
  human:        { cols: [1, 2, 3, 4], rows: { down: 0, up: 1, left: 2, right: 3 }, idle: { c: 1, r: 0 } },
};

let spritesReady = false;

function loadAllSprites() {
  const all = [
    ...Object.values(BIOME_SPRITES),
    ...Object.values(BIOME_SPRITES).flatMap(sp => sp.overlay ? (Array.isArray(sp.overlay) ? sp.overlay : [sp.overlay]) : []),
    ...Object.values(ENTITY_SPRITES),
    ...Object.values(TREE_SPRITES),
    CLIFF_SPRITE, PALM_SPRITE, DEEPS_SPRITE, BLENDS_SPRITE, CAMPFIRE_SPRITE, HOUSE_SPRITE, BOX_SELECTOR_SPRITE,
    // src OBLIGATOIRE ici : le loader fait `sp.img.src = sp.src` inconditionnellement →
    // sans src, il écraserait le src déjà posé (WHEAT/MILL) ou vide (WELL) par undefined.
    { img: WHEAT_IMG, src: WHEAT_IMG.src }, { img: MILL_IMG, src: MILL_IMG.src }, WELL_SPRITE,
  ];
  let loaded = 0;
  const done = () => {
    if (++loaded === all.length) {
      spritesReady = true;
      buildBiomeCache();
      if (worldData) { fitWorld(); drawAll(); }
    }
  };
  all.forEach(sp => {
    sp.img.onload  = done;
    sp.img.onerror = done;
    sp.img.src     = sp.src;
    if (sp.img.complete) done();
  });
}

loadAllSprites();

// ── WebSocket ────────────────────────────────────────────────────────────────
// wss:// obligatoire quand la page est servie en HTTPS (ex. via tailscale serve) :
// un navigateur bloque un ws:// non sécurisé depuis une page https (mixed content).
const _wsProto = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(`${_wsProto}//${location.host}/ws`);
ws.onopen  = () => setStatus("Connecté", true);
ws.onclose = () => setStatus("Déconnecté", false);
ws.onerror = () => setStatus("Erreur WS", false);

ws.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "init") {
    handleInit(msg.data);
  } else if (msg.type === "tick") {
    handleTick(msg.data);
  }
};

function setStatus(text, ok) {
  document.getElementById("statusbar").textContent = text;
  document.getElementById("status-dot").className = "dot" + (ok ? "" : " paused");
}

// ── Init ─────────────────────────────────────────────────────────────────────
let goldVeins = [];   // filons d'or [x, y] (C2, statique)
function handleInit(data) {
  worldData = data.world;
  if (data.ticks_per_season) CAL_TICKS_PER_SEASON = data.ticks_per_season;
  goldVeins = data.world.gold_veins || [];
  entities  = data.entities;
  stats     = data.stats;
  history   = data.history || [];
  clans     = data.clans  || [];
  refreshChronicle();   // annales (bloc K) : chargement initial
  refreshTerritory();   // territoire (T1) : owner-grid initial
  stumps         = new Set((data.world.stumps         || []).map(([x, y]) => `${x},${y}`));
  depleted_rocks = new Set((data.world.depleted_rocks || []).map(([x, y]) => `${x},${y}`));
  fires          = new Map((data.world.fires || []).map(([x, y]) => [`${x},${y}`, 80]));
  buildings = data.buildings || [];
  currentTick   = data.tick;
  currentSeason = data.season || "spring";
  currentTemp   = data.temp_c  != null ? data.temp_c  : null;
  currentRain     = data.raining   || false;
  currentStorm    = data.storming  || false;
  currentHeatwave = data.heatwave  || false;
  buildEntityMap();
  if (spritesReady) buildBiomeCache();
  fitWorld();
  resizeCanvas();
  updateSidebar();
  updateSeasonBadge();
  (data.events || []).forEach(addEvent);
}

function handleTick(data) {
  currentTick   = data.tick;
  currentSeason = data.season || currentSeason;
  if (data.temp_c   != null) currentTemp  = data.temp_c;
  if (data.raining  != null) currentRain     = data.raining;
  if (data.storming != null) currentStorm    = data.storming;
  if (data.heatwave != null) currentHeatwave = data.heatwave;
  if (data.clans) clans = data.clans;
  // Snapshot des positions du tick PRÉCÉDENT (source de l'interpolation) + horloge
  // du tick (EMA de l'intervalle réel, bornée ; les gros gaps de pause sont ignorés).
  prevPos = {};
  for (const e of entities) prevPos[e.id] = { x: e.x, y: e.y };
  const _now = performance.now();
  const _dt  = _now - lastTickTime;
  if (lastTickTime && _dt < 1000)
    tickInterval = Math.max(60, Math.min(1000, tickInterval * 0.8 + _dt * 0.2));
  lastTickTime = _now;
  entities    = data.entities;
  stats       = data.stats;
  buildEntityMap();
  if (data.stats) history.push({ tick: data.tick, ...data.stats });
  if (history.length > 300) history.shift();
  (data.tree_changes || []).forEach(tc => {
    const key = `${tc.x},${tc.y}`;
    if (tc.stump) stumps.add(key); else stumps.delete(key);
  });
  if (data.buildings !== undefined) buildings = data.buildings;
  (data.fire_changes || []).forEach(fc => {
    const key = `${fc.x},${fc.y}`;
    if (fc.fire) fires.set(key, fc.i || 80); else fires.delete(key);
  });
  if (data.biome_changes && data.biome_changes.length > 0 && biomeCache) {
    const octx = biomeCache.getContext("2d");
    octx.imageSmoothingEnabled = false;
    data.biome_changes.forEach(({x, y, biome}) => {
      worldData.biomes[y][x] = biome;
      redrawBiomeTile(octx, x, y, biome);
    });
    // NB : biome_changes ne concerne QUE GRASS↔DIRT (surpâturage). La forêt est un masque
    // immuable → la canopée (TREES) n'a jamais à être reconstruite ici (elle l'est une
    // seule fois au chargement, dans buildBiomeCache).
  }
  const tl = document.getElementById("tick-label");
  tl.textContent = tickToDate(currentTick);
  tl.title = `Tick ${currentTick}`;
  document.getElementById("total-label").textContent = `${data.stats.total} entités`;
  // Effets éphémères vieillis au TICK (pas au frame) → durée de vie stable malgré le 60 fps.
  bellRings.forEach(r => r.age++);   bellRings   = bellRings.filter(r => r.age < 40);
  huntFlashes.forEach(f => f.age++); huntFlashes = huntFlashes.filter(f => f.age < 10);
  // (le rendu canvas est piloté par la boucle requestAnimationFrame, pas ici)
  updateSidebar();
  updateSeasonBadge();
  updateBuildingPanel();
  if ((data.events || []).some(ev => ev.type === "lightning")) lightningAt = performance.now();
  (data.events || []).forEach(addEvent);
}

// ── Calendrier (bloc I) : 1 saison = 30 jours ; la LONGUEUR de la saison vient du
// moteur (full_state.ticks_per_season) — jamais figée ici : une valeur en dur
// afficherait des dates fausses en silence au prochain changement de TIME_SCALE.
// À 1800 t/saison → jour de 60 ticks → une bête parcourt ~60 cases/jour = réaliste
// (c'était 10 ticks/jour = « quelques cases par jour », l'irréalisme signalé par Alexis).
let   CAL_TICKS_PER_SEASON = 1800;   // défaut de repli, écrasé à l'init par le serveur
const CAL_DAYS_PER_SEASON  = 30;
const SEASON_FR = ["Printemps", "Été", "Automne", "Hiver"];
function tickToDate(tick) {
  const an     = Math.floor(tick / (CAL_TICKS_PER_SEASON * 4)) + 1;
  const saison = SEASON_FR[Math.floor(tick / CAL_TICKS_PER_SEASON) % 4];
  const jour   = Math.floor((tick % CAL_TICKS_PER_SEASON)
                            / (CAL_TICKS_PER_SEASON / CAL_DAYS_PER_SEASON)) + 1;
  return `An ${an} · ${saison}, j.${jour}`;
}

// ── Chroniques (bloc K) : annales du monde, fetch initial + poll léger ─────────
async function refreshChronicle() {
  try {
    const r = await fetch("/api/chronicle");
    const d = await r.json();
    const log = document.getElementById("chronicle-log");
    if (!log || !d.chronicle) return;
    log.innerHTML = "";
    // Les plus récentes en haut
    [...d.chronicle].reverse().forEach(c => {
      const div = document.createElement("div");
      div.className = `chron-item ${c.kind}`;
      div.innerHTML = `<span class="chron-date">${tickToDate(c.t)}</span>${c.msg}`;
      log.appendChild(div);
    });
  } catch (e) { /* serveur occupé → retentera au prochain poll */ }
}
setInterval(refreshChronicle, 20000);

// rasterise UNE fois par poll dans un canvas 1px/tuile ; drawAll le blitte mis à l'échelle
// (pas 35k rectangles/frame). Le territoire bouge lentement → poll espacé suffit.
let territoryCanvas = null;   // offscreen HTMLCanvasElement (résolution = tuiles)
